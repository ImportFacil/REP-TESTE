# Ambiente local: PostgreSQL e Redis iguais aos da AWS.
# Uso: docker compose up -d  →  npm run build && npm run migrar && npm run semear -- --demonstracao && npm run dev
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: exportfacil
      POSTGRES_PASSWORD: exportfacil
      POSTGRES_DB: exportfacil
    ports: ["5432:5432"]
    volumes: [banco:/var/lib/postgresql/data]
  cache:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  banco:
