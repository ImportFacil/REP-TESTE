# Entrega contínua: a cada commit no main, testa, publica a imagem e faz o deploy em homologação.
# Produção recebe a MESMA imagem, depois da aprovação no environment "producao" do GitHub.
#
# Enquanto a AWS não estiver configurada (variável AWS_PAPEL_BUILD vazia), só os testes rodam.
name: Entrega

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente para o deploy manual
        type: choice
        options: [dev, homolog]
        default: dev

permissions:
  contents: read
  id-token: write # login na AWS por OIDC, sem chaves guardadas

concurrency:
  group: entrega
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  configuracao:
    name: AWS configurada?
    runs-on: ubuntu-latest
    outputs:
      pronta: ${{ steps.verificar.outputs.pronta }}
    steps:
      - id: verificar
        run: |
          if [ -n "${{ vars.AWS_PAPEL_BUILD }}" ] && [ -n "${{ vars.ECR_REPOSITORIO }}" ]; then
            echo "pronta=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS ainda não configurada: defina as variáveis AWS_PAPEL_BUILD e ECR_REPOSITORIO (ver infra/README.md). Só os testes rodaram."
          fi

  imagem:
    name: Publicar imagem
    needs: [testes, configuracao]
    if: needs.configuracao.outputs.pronta == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PAPEL_BUILD }}
          aws-region: sa-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Já existe imagem deste commit?
        id: existe
        run: |
          repo="${{ vars.ECR_REPOSITORIO }}"
          if aws ecr describe-images --repository-name "${repo#*/}" --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.sim != 'true'
      - uses: docker/build-push-action@v6
        if: steps.existe.outputs.sim != 'true'
        with:
          context: backend
          push: true
          provenance: false
          tags: ${{ vars.ECR_REPOSITORIO }}:${{ github.sha }}
          build-args: VERSAO_APP=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dev:
    needs: imagem
    if: github.event_name == 'workflow_dispatch' && inputs.ambiente == 'dev'
    uses: ./.github/workflows/_deploy.yml
    with:
      ambiente: dev
      environment: dev
      tag: ${{ needs.imagem.outputs.tag }}

  homolog:
    needs: imagem
    if: github.event_name == 'push' || inputs.ambiente == 'homolog'
    uses: ./.github/workflows/_deploy.yml
    with:
      ambiente: homolog
      environment: homolog
      tag: ${{ needs.imagem.outputs.tag }}

  producao:
    needs: [imagem, homolog]
    if: github.event_name == 'push'
    uses: ./.github/workflows/_deploy.yml
    with:
      ambiente: prod
      environment: producao # configure "Required reviewers" neste environment
      tag: ${{ needs.imagem.outputs.tag }}
