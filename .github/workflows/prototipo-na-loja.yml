# Mantém a cópia do protótipo dentro da loja (bagisto/prototipo/index.html) igual ao index.html da raiz.
# A loja mostra o protótipo dentro do app em /prototipo (ver bagisto/scripts/preparar-prototipo.py).
name: Protótipo na loja

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/prototipo-na-loja.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: prototipo-na-loja
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar o protótipo para a loja
        run: |
          mkdir -p bagisto/prototipo
          cp index.html bagisto/prototipo/index.html
          if git diff --quiet -- bagisto/prototipo/index.html; then echo "Cópia já atualizada."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bagisto/prototipo/index.html
          git commit -m "Protótipo atualizado dentro da loja"
          git pull --rebase origin main
          git push origin HEAD:main
          # commits do GITHUB_TOKEN não disparam outros workflows: chama o da loja diretamente
          gh workflow run bagisto.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
