name: Demo Bagisto

# Monta a demonstração Bagisto 2.5 + B2B Suite com o catálogo da ImportFácil, testa as páginas,
# tira capturas de tela e publica a imagem no GitHub Packages (ghcr.io).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo-bagisto/**'
      - '.devcontainer/bagisto-demo/**'
      - '.github/workflows/bagisto-demo.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: bagisto-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem e subir MySQL + Bagisto
        working-directory: demo-bagisto
        run: |
          docker compose build
          docker compose up -d

      - name: Esperar a instalação e o catálogo
        run: |
          for i in $(seq 1 240); do
            if curl -sf -o /dev/null http://localhost:8000/; then echo "Loja no ar depois de $((i*10)) s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' demo-bagisto-app-1 2>/dev/null)" != "true" ]; then
              echo "O contêiner da loja parou"; exit 1
            fi
            sleep 10
          done
          echo "Tempo esgotado"; exit 1

      - name: Resumo da instalação
        if: always()
        run: |
          docker compose -f demo-bagisto/docker-compose.yml ps -a
          for c in $(docker ps -aq); do echo "== $(docker inspect -f '{{.Name}} saída={{.State.ExitCode}} erro={{.State.Error}}' $c)"; done
          docker logs demo-bagisto-app-1 2>&1 | grep -v "^\s*$" | tail -150

      - name: Navegar e tirar capturas
        working-directory: demo-bagisto/testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node capturas.mjs http://localhost:8000 ../catalogo-importfacil.json capturas

      - name: Publicar capturas no ramo demo-bagisto-capturas
        if: always()
        run: |
          [ -d demo-bagisto/testes/capturas ] || exit 0
          cd demo-bagisto/testes/capturas
          git init -q -b demo-bagisto-capturas
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Capturas da demo Bagisto (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" demo-bagisto-capturas

      - name: Guardar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-demo-bagisto
          path: demo-bagisto/testes/capturas
          if-no-files-found: ignore

      - name: Log do Laravel em caso de erro
        if: failure()
        run: |
          docker compose -f demo-bagisto/docker-compose.yml exec -T app bash -c 'tail -n 150 storage/logs/laravel.log 2>/dev/null || true'

      - name: Publicar a imagem no GitHub Packages
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          dono=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag importfacil-bagisto-demo "ghcr.io/$dono/importfacil-bagisto-demo:latest"
          docker push "ghcr.io/$dono/importfacil-bagisto-demo:latest" || echo "Não foi possível publicar a imagem (permissão de pacotes da organização)."
