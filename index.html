/* ---------- Modalidades: encomenda (padrão) e conta e ordem (clientes faixa A) ---------- */
const modalTxt = o => o.modal==='contaordem' ? 'Por conta e ordem' : 'Sob encomenda';
const coValores = total => ({merc:Math.round(total*100)/100, trib:Math.round(total*politica.coTribPct)/100, serv:Math.round(total*politica.coServPct)/100});
function addNumerario(oc, etapa, valor, rotulo){
  if(parcelas.some(p=>p.pedido===oc.num&&p.etapa===etapa)) return;
  parcelas.push({id:Date.now()+Math.random(), pedido:oc.num, n:1, de:1, valor:Math.round(valor*100)/100, venc:D0,
    pago:false, pagoEm:null, forma:'Pix · numerário', etapa, rotulo, expira:Date.now()+politica.pixHoras*3600e3});
}
const numerario = (oc, etapa) => parcelas.find(p=>p.pedido===oc.num&&p.etapa===etapa);
const numPago = (oc, etapa) => !!(numerario(oc,etapa)||{}).pago;
/* o que impede a ordem de avançar (só na conta e ordem: a ImportFácil nunca adianta dinheiro próprio) */
function bloqueioOC(oc){
  const i=OC_ETAPAS.indexOf(oc.status), prox=OC_ETAPAS[i+1];
  if(oc.modal!=='contaordem' || !prox) return '';
  if(prox==='Em processo de importação' && !numPago(oc,'cambio')) return 'Aguardando o numerário da mercadoria para fechar o câmbio';
  if(prox==='Entregue' && !numPago(oc,'tributos')) return 'Aguardando o numerário de tributos para registrar a DUIMP';
  return '';
}
function ocAvanca(oc){
  if(!oc) return false;
  const i=OC_ETAPAS.indexOf(oc.status); if(i<0||i>=OC_ETAPAS.length-1) return false;
  const b=bloqueioOC(oc); if(b){ toast(b); return false; }
  oc.status=OC_ETAPAS[i+1]; oc.hist.push({st:oc.status,quando:agoraTxt()});
  if(oc.modal==='contaordem' && oc.status==='Em trânsito') addNumerario(oc,'tributos',coValores(oTotal(oc)).trib,'Numerário de tributos e despesas');
  if(oc.status==='Entregue') faturarOC(oc);
  else toast(oc.num+': '+oc.status);
  return true;
}
/* Entrega = faturamento. Encomenda: nota de venda e cobrança do total. Conta e ordem: notas de saída e de serviço,
   cobrança só da taxa de serviço e prestação de contas do numerário */
function faturarOC(oc){
  if(oc.faturada) return;
  nfeSeq = Math.max(nfeSeq, ...pedidos.concat(ordens).map(x=>x.nfe?x.nfe.n:0)) + 1;
  oc.nfe = {n:nfeSeq, data:dataHoje()}; oc.faturada = true;
  const co = oc.modal==='contaordem', v = coValores(oTotal(oc));
  const valor = co ? v.serv : oTotal(oc), cond = oc.cond.pgto;
  if(/Cart/i.test(cond)){ const c=cartaoCalc(valor, politica.cartaoSemJurosAte);
    oc.cartao={n:c.n, parc:c.parc, total:Math.round(c.total*100)/100, juros:c.juros, pagoEm:fmtD(D0)}; }
  else { const ini=parcelas.length; gerarParcelas(oc.num, cond+(co?' · serviço':''), valor, D0);
    if(co) parcelas.slice(ini).forEach(p=>p.rotulo='Taxa de serviço'+(p.de>1?' '+p.n+'/'+p.de:'')); }
  if(co){ const pago=['cambio','tributos'].reduce((s,e)=>s+((numerario(oc,e)||{}).pagoValor||0),0);
    oc.prestacao={recebido:pago, gasto:v.merc+v.trib, saldo:Math.round((pago-(v.merc+v.trib))*100)/100}; }
  toast(oc.num+': entregue · '+(co?'notas de saída e de serviço emitidas':'NF-e de venda '+oc.nfe.n+' emitida'));
}
function cardModalOC(oc){
  const co = oc.modal==='contaordem', v = coValores(oTotal(oc));
  const nums = parcelas.filter(p=>p.pedido===oc.num&&p.etapa), outras = parcelas.filter(p=>p.pedido===oc.num&&!p.etapa);
  const b = bloqueioOC(oc);
  return `<div class="card noprint"><h2 class="h3x">${modalTxt(oc)}</h2>
    ${co?`<div class="muted" style="margin-bottom:6px">Você compra em seu nome e paga o numerário por Pix antes de cada etapa. A ImportFácil cobra só o serviço.</div>
      <div class="specrow"><span>Numerário da mercadoria (antes do câmbio)</span><span>${BRL(v.merc)}</span></div>
      <div class="specrow"><span>Numerário de tributos e despesas (estimado, antes da DUIMP)</span><span>${BRL(v.trib)}</span></div>
      <div class="specrow"><span>Taxa de serviço · ${oesc(oc.cond.pgto)}</span><span>${BRL(v.serv)}</span></div>
      ${b?`<div class="alert" style="margin-top:8px">⏳<div><b>${b}</b>A ordem avança assim que o banco confirmar o Pix.</div></div>`:''}
      ${nums.length?`<div style="margin-top:8px">${nums.map(linhaParc).join('')}</div>`:''}
      ${oc.prestacao?`<h2 class="h3x" style="margin-top:10px">Prestação de contas</h2>
        <div class="specrow"><span>Numerário recebido</span><span>${BRL(oc.prestacao.recebido)}</span></div>
        <div class="specrow"><span>Gasto na importação</span><span>${BRL(oc.prestacao.gasto)}</span></div>
        <div class="specrow"><span>${oc.prestacao.saldo>=0?'Saldo a devolver':'Saldo a cobrar'}</span><b>${BRL(Math.abs(oc.prestacao.saldo))}</b></div>
        <div class="muted">No protótipo, o gasto real é igual à estimativa.</div>`:''}`
    :`<div class="muted" style="margin-bottom:6px">A ImportFácil compra, importa e vende a você. A cobrança sai na entrega, com a nota de venda.</div>
      <div class="specrow"><span>Pagamento</span><span>${oesc(oc.cond.pgto)}</span></div>
      <div class="specrow"><span>Total</span><span>${BRL(oTotal(oc))}</span></div>`}
    ${oc.nfe?`<div class="specrow"><span>${co?'Notas de saída e de serviço':'NF-e de venda'}</span><span>nº ${oc.nfe.n} · ${oc.nfe.data}</span></div>`:''}
    ${outras.length?`<div style="margin-top:8px">${outras.map(linhaParc).join('')}</div>`:''}
    ${oc.cartao?`<div class="specrow"><span>Cartão de crédito</span><span>${oc.cartao.n}× de ${BRL(oc.cartao.parc)}</span></div>`:''}
  </div>`;
}
function ocAvancar(num){ const oc=ordens.find(x=>x.num===num); if(ocAvanca(oc)) rOrdem(); }

    return `<div class="tl-i ${i<cur?'done':i===cur?'now':''}"><span class="dot"></span><div><b>${s}</b>${h?`<div class="muted">${h.quando}</div>`:''}</div></div>`;}).join('')}</div>`;
}

/* ---------- máscaras e validação ---------- */
function mask(v,t){
  const d=(v||'').replace(/\D/g,'');
  if(t==='cnpj'){let o='';for(let i=0;i<d.length&&i<14;i++){if(i===2||i===5)o+='.';if(i===8)o+='/';if(i===12)o+='-';o+=d[i];}return o;}
  if(t==='cep'){let o='';for(let i=0;i<d.length&&i<8;i++){if(i===5)o+='-';o+=d[i];}return o;}
  if(t==='tel'){let o='';for(let i=0;i<d.length&&i<11;i++){if(i===0)o+='(';if(i===2)o+=') ';if(i===(d.length>10?7:6))o+='-';o+=d[i];}return o;}
  if(t==='data'){let o='';for(let i=0;i<d.length&&i<8;i++){if(i===2||i===4)o+='/';o+=d[i];}return o;}
  if(t==='money'){if(!d)return '';return (parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2});}
  return v;
}
function validaCNPJ(v){
  const c=(v||'').replace(/\D/g,'');
  if(c.length!==14 || /^(\d)\1{13}$/.test(c)) return false;
  const calc=b=>{const p=b.length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];
    let s=0;for(let i=0;i<b.length;i++)s+=+b[i]*p[i];const r=s%11;return r<2?0:11-r;};
  const d1=calc(c.slice(0,12)), d2=calc(c.slice(0,12)+d1);
  return c === c.slice(0,12)+''+d1+''+d2;
}
const validaEmail = v => /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test((v||'').trim());
function setCad(k,v,m){
  cad[k] = m ? mask(v,m) : v;
  if(m){const el=document.getElementById('cad_'+k); if(el) el.value=cad[k];}
}
function F(k,lbl,o){
  o=o||{};
  const v=oesc(cad[k]==null?'':String(cad[k]));

      <option value="">Selecione…</option>${o.opts.map(x=>`<option ${cad[k]===x?'selected':''}>${oesc(x)}</option>`).join('')}</select>`;
  else if(o.t==='textarea') campo=`<textarea id="cad_${k}" rows="2" placeholder="${o.ph||''}" oninput="setCad('${k}',this.value)">${oesc(cad[k]||'')}</textarea>`;
  else campo=`<input id="cad_${k}" ${o.im?'inputmode="'+o.im+'"':''} placeholder="${o.ph||''}" value="${v}" oninput="setCad('${k}',this.value${o.m?",'"+o.m+"'":''})">`;
  return `<div class="fld"><label>${lbl}${req}</label>${campo}</div>`;
}

}

/* ==================================================================
   FINANCEIRO — pagamentos executados, saldo a pagar e vencimentos
   Cada pedido gera parcelas conforme a condição de pagamento.
   ================================================================== */
let parcelas = [];   // {id, pedido, n, de, valor, venc:Date, pago, pagoEm, forma}

const D0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
const addD = (d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const fmtD = d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const diasAte = d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-D0)/86400000);

/* prazos embutidos na condição de pagamento */
function prazosDe(cond){
  if(/PIX/i.test(cond)) return [0];
  const m=(cond.match(/\d+/g)||[]).map(Number);
  return m.length?m:[0];
}
function gerarParcelas(numPedido, cond, total, base){
  const dias=prazosDe(cond), n=dias.length;
  const bruto=Math.round(total/n*100)/100;
  dias.forEach((d,i)=>{
    const valor = i===n-1 ? Math.round((total-bruto*(n-1))*100)/100 : bruto;
    parcelas.push({id:Date.now()+i+Math.random(), pedido:numPedido, n:i+1, de:n, valor,
      venc:addD(base,d), pago:false, pagoEm:null, forma:cond,
      expira: /pix/i.test(cond) ? Date.now()+politica.pixHoras*3600e3 : null});
  });
}
const nParcelas = num => parcelas.filter(p=>p.pedido===num).length;
const stParc = p => p.pago ? 'Pago' : ehPix(p) ? (pixExpirado(p) ? 'Pix expirado' : 'Aguardando Pix') : (diasAte(p.venc)<0 ? 'Vencido' : diasAte(p.venc)===0 ? 'Vence hoje' : 'A vencer');
/* vencido acumula multa de 2% + juros de 1% ao mês */
function valorAtual(p){
  if(p.pago || ehPix(p)) return p.valor;
  const atraso=-diasAte(p.venc);
  return atraso>0 ? p.valor*(1+politica.multa/100+politica.jurosAm/100/30*atraso) : p.valor;
}
const emAberto  = ()=>parcelas.filter(p=>!p.pago).reduce((s,p)=>s+p.valor,0);
const jaPago    = ()=>parcelas.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);
const nAtraso   = ()=>parcelas.filter(p=>!p.pago&&!ehPix(p)&&diasAte(p.venc)<0).length;
const nAtrasoBloq = ()=>parcelas.filter(p=>!p.pago&&!ehPix(p)&&diasAte(p.venc)< -politica.atrasoBloqueio).length;
const vence7    = ()=>parcelas.filter(p=>!p.pago&&diasAte(p.venc)>=0&&diasAte(p.venc)<=7).reduce((s,p)=>s+p.valor,0);
/* crédito só existe depois da aprovação da equipe (ou se a política dispensar) */
const creditoLiberado = () => !politica.exigirAprovacao || cadStatus==='Aprovado';
function limiteSolicitado(){
  if(cad && cad.limite){const v=parseFloat(String(cad.limite).replace(/\./g,'').replace(',','.')); if(v>0) return v;}
  return P()?P().min*12:0;
}
/* limite sugerido pela política: 2× o pedido mínimo do tipo, ajustado pela faixa */
const limiteSugerido = (tipo, faixa) => PERFIS[tipo] ? PERFIS[tipo].min*2*FAIXAS[faixa||'A'].fator : 0;
function limiteCredito(){
  if(!creditoLiberado()) return 0;
  if(cad && cad.faixa==='C') return 0;
  return (cad && +cad.limiteAprov>0) ? +cad.limiteAprov : limiteSolicitado();
}
const prazosBoletoCliente = () => prazosBoleto().slice(0, cadStatus==='Aprovado' ? faixaAtual().maxBoleto||0 : prazosBoleto().length);
/* consomem limite: boletos em aberto + pedidos e ordens no boleto que ainda não foram faturados.
   Pix é à vista e o cartão é risco da operadora */
const usoLimite = () => parcelas.filter(p=>!p.pago&&/Boleto/i.test(p.forma)).reduce((s,p)=>s+p.valor,0)
  + pedidos.filter(o=>o.aguardaFat).reduce((s,o)=>s+o.total,0)
  + ordens.filter(oc=>oc.modal!=='contaordem'&&/Boleto/i.test(oc.cond.pgto)&&!oc.faturada&&oc.status!=='Cancelada').reduce((s,oc)=>s+oTotal(oc),0);
function bloqueioBoleto(total){
  if(!creditoLiberado()) return {t:'Boleto exige cadastro aprovado',
    d: cadStatus ? 'Seu cadastro está '+cadStatus.toLowerCase()+'. Assim que a equipe aprovar o crédito, o boleto é liberado.' : 'Envie o cadastro da empresa para a análise de crédito.',
    acao: cadStatus ? ['Ver cadastro',"go('meucadastro')"] : ['Fazer cadastro',"go('cadastro')"]};
  if(cad && cad.faixa==='C') return {t:'Boleto indisponível para a sua faixa de crédito', d:'Compre no Pix ou no cartão. A faixa é revista pelo financeiro a cada trimestre ou a pedido.', acao:['Falar com o comercial',"go('contato')"]};
  if(nAtrasoBloq()) return {t:'Há parcelas com mais de '+politica.atrasoBloqueio+' dias de atraso', d:'Pague as parcelas vencidas para voltar a comprar no boleto.', acao:['Ver Financeiro',"go('financeiro')"]};
  const disp = limiteCredito()-usoLimite();
  if(total>disp) return {t:'Limite de crédito insuficiente', d:'Disponível '+BRL(Math.max(0,disp))+' para um pedido de '+BRL(total)+'. Pague no Pix ou no cartão, ou peça aumento de limite ao comercial.', acao:['Falar com o comercial',"go('contato')"]};
  return null;
}
function avisoFin(){
  if(!parcelas.length) return '';
  const atras=nAtraso(), prox=parcelas.filter(p=>!p.pago&&diasAte(p.venc)>=0&&diasAte(p.venc)<=7);
  const acao='<button type="button" class="btn outline sm ui-alert-action" onclick="go(\'financeiro\')">Ver</button>';
  if(atras) return `<div role="alert" data-slot="alert" data-variant="destructive" class="ui-alert">${I('triangle-alert')}
    <div class="ui-alert-title" data-slot="alert-title">${atras} parcela(s) em atraso</div>
    <div class="ui-alert-desc" data-slot="alert-description">Regularize para não travar novos pedidos a prazo.</div>${acao}</div>`;
  if(prox.length){
    const prim=prox.slice().sort((a,b)=>a.venc-b.venc)[0];
    return `<div role="alert" data-slot="alert" class="ui-alert">${I('info')}

  }
  return '';
}

    ${creditoLiberado()?`<div class="card">

/* Tabela de faturas (padrão shadcn Table) */
const FATURAS_EXEMPLO=[
  ['INV001','Pago','Cartão de crédito',250],['INV002','Pendente','Pix',150],['INV003','Não pago','Boleto',350],

}
function linhaParc(p){
  const st=stParc(p), d=diasAte(p.venc);

      ${!p.pago&&!ehPix(p)&&d<0?`<div class="muted" style="margin-top:2px">com multa e juros: <b class="neg">${BRL(valorAtual(p))}</b></div>`:''}

function cardPedidoFin(num){

  const pct=Math.round(pg/tot*100), falta=tot-pg;
  const prox=ps.filter(p=>!p.pago).sort((a,b)=>a.venc-b.venc)[0];
  return `<div class="card">
    <div class="row"><b style="font-size:.88rem">${num}</b>
      <span class="chip ${falta<=0?'ok':ps.some(p=>!p.pago&&diasAte(p.venc)<0)?'cancel':'pend'}">${falta<=0?'Quitado':'Em aberto'}</span></div>
    <div class="muted" style="margin:3px 0 7px">${ps[0].forma} · ${ps.filter(p=>p.pago).length} de ${ps.length} parcela(s) paga(s)</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row" style="margin-top:8px"><span class="muted">Total do pedido</span><b>${BRL(tot)}</b></div>
    <div class="row" style="margin-top:3px"><span class="muted">Já pago</span><b class="pos">${BRL(pg)}</b></div>
    <div class="row" style="margin-top:3px"><span class="muted">Falta pagar</span><b class="${falta>0?'neg':'pos'}">${BRL(falta)}</b></div>

  </div>`;
}
function cardParcelas(num){
  const ps=parcelas.filter(p=>p.pedido===num).sort((a,b)=>a.venc-b.venc);
  if(!ps.length) return '';
  const tot=ps.reduce((s,p)=>s+p.valor,0), pg=ps.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);
  return `<div class="card"><h2 class="h3x">Pagamentos</h2>
    <div class="row"><span class="muted">Pago</span><b class="pos">${BRL(pg)}</b></div>

    <div class="bar"><i style="width:${Math.round(pg/tot*100)}%"></i></div>
    <div style="margin-top:8px">${ps.map(linhaParc).join('')}</div>
    <button class="btn outline sm block" style="margin-top:8px" onclick="go('financeiro')">Abrir o Financeiro</button>

/* ---------- pagar parcela ----------
   O cliente só vê os códigos para pagar. Quem dá baixa é o banco/gateway (webhook);
   no protótipo, "Simular confirmação do banco" faz esse papel. */
const parcById = id => parcelas.find(x=>String(x.id)===String(id));
function codBoleto(p){
  const v = String(Math.round(valorAtual(p)*100)).padStart(10,'0');
  const r = String(Math.abs(String(p.id).split('').reduce((h,c)=>h*31+c.charCodeAt(0)|0,7))).padStart(10,'0').slice(0,10);
  return '34191.79001 '+r.slice(0,5)+'.'+r.slice(5)+'1 91020.150008 8 '+String(9000+p.n)+v;
}
const horaTxt = t => { const d=new Date(t); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function novoPix(id){
  const p = parcById(id); if(!p) return;
  p.expira = Date.now()+politica.pixHoras*3600e3; p.pixSeq = (p.pixSeq||0)+1;
  sheetPagar(id); render(cur); toast('Novo Pix gerado ✓ · válido por '+politica.pixHoras+' horas');
}
function expirarPix(id){ const p = parcById(id); if(!p) return; p.expira = Date.now()-1000; closeSheet(); render(cur); toast('Simulação: 24 h sem pagamento · Pix expirado'); }
function codPix(p){
  const v = valorAtual(p).toFixed(2);
  return '00020126360014br.gov.bcb.pix0114IMPORTFACILPIX520400005303986540'+v.length+v+'5802BR5911ImportFacil6014BELO HORIZONTE62140510'+p.pedido.replace(/\W/g,'')+(p.pixSeq||0)+'6304A1B2';
}
function copiarTxt(t, rot){
  const falha = () => toast('Não deu para copiar: selecione o código e copie manualmente');
  try{ navigator.clipboard.writeText(t).then(()=>toast(rot+' copiado ✓'), falha); }catch(e){ falha(); }
}
function copiar(t, rot){ copiarTxt(t, rot); }
function sheetPagar(id){
  const p = parcById(id); if(!p) return;
  const atraso = -diasAte(p.venc)>0, pix = /pix/i.test(p.forma);
  openSheet(`
    <h2>${pix?(pixExpirado(p)?'Pix expirado':'Pagar com Pix'):'Pagar '+(p.rotulo||'parcela '+p.n+'/'+p.de)}</h2>
    <div class="muted" style="margin-bottom:8px">${p.pedido} · vencimento ${fmtD(p.venc)}</div>
    ${atraso?`<div class="alert" style="margin-bottom:10px">⚠️<div><b>Parcela em atraso</b>Valor original ${BRL(p.valor)}, com multa de ${politica.multa}% e juros de ${politica.jurosAm}% ao mês.</div></div>`:''}
    <div class="row" style="margin-bottom:10px"><span class="muted">Valor a pagar</span><b style="font-size:1.15rem">${BRL(valorAtual(p))}</b></div>
    ${pix?'':`<label>Linha digitável do boleto</label><div class="codebox" id="cbBol">${codBoleto(p)}</div>
    <button class="btn outline sm block" onclick="copiarTxt(document.getElementById('cbBol').textContent,'Linha digitável')">Copiar linha digitável</button>`}
    ${pix&&pixExpirado(p)?`<div class="alert" style="margin:6px 0 10px">⏰<div><b>Este Pix venceu sem pagamento</b>O pedido continua aguardando. Gere um novo código, válido por ${politica.pixHoras} horas.</div></div>
    <button class="btn default block" onclick="novoPix('${p.id}')">Gerar novo Pix</button>`:`
    <label style="margin-top:10px">Pix copia e cola${pix?' · válido até '+horaTxt(p.expira||Date.now()):' (também quita este boleto)'}</label><div class="codebox" id="cbPix">${codPix(p)}</div>
    <button class="btn ${pix?'default':'outline'} sm block" onclick="copiarTxt(document.getElementById('cbPix').textContent,'Código Pix')">Copiar código Pix</button>`}
    <div class="muted" style="margin-top:10px">A baixa é automática: o Pix é confirmado em segundos e o boleto em até 1 dia útil. Não é preciso enviar comprovante.</div>
    <div class="note">Protótipo: os códigos são fictícios e não podem ser pagos. No app real, eles vêm do gateway de pagamento.
      ${pix&&pixExpirado(p)?'':`<button class="btn outline sm block" style="margin-top:8px" onclick="bancoConfirma('${p.id}','${pix?'Pix':'Boleto'}')">Simular confirmação do banco</button>`}
      ${pix&&!pixExpirado(p)?`<button class="btn outline sm block" style="margin-top:6px" onclick="expirarPix('${p.id}')">Simular 24 h sem pagamento</button>`:''}</div>`);
}
function copiarBoleto(num){
  const p = parcelas.filter(x=>x.pedido===num&&!x.pago).sort((a,b)=>a.venc-b.venc)[0];
  if(p) copiarTxt(codBoleto(p),'Linha digitável de '+num);
}
function bancoConfirma(id, via){
  const p = parcById(id); if(!p) return;
  if(pixExpirado(p)){ toast('Este Pix expirou: gere um novo código'); return; }
  p.pagoValor = Math.round(valorAtual(p)*100)/100;
  p.pago = true; p.pagoEm = fmtD(D0); p.pagoVia = via;
  const o = pedidos.find(x=>x.num===p.pedido);
  if(o && /pix/i.test(o.pgto) && o.status<2) o.status = 2;
  closeSheet(); render(cur); badges();
  const resto = parcelas.filter(x=>x.pedido===p.pedido&&!x.pago).length;
  toast('Banco confirmou o '+via+' ✓'+(resto?' · faltam '+resto+' parcela(s) do '+p.pedido:' · '+p.pedido+' quitado'));
}

/* ==================================================================
   PAINEL DA EQUIPE (protótipo da visão interna da ImportFácil)
   No app real fica em outro acesso, só para a equipe, com dados de
   todos os clientes vindos do servidor. Aqui opera sobre este navegador.

let eqTab = 'cadastros';
function rEquipe(){
  escondeBar();
  const abas = [['cadastros','Crédito'],['pedidos','Pedidos'],['recebiveis','Recebíveis'],['condicoes','Condições']];
  const corpo = {cadastros:eqCadastros, pedidos:eqPedidos, recebiveis:eqRecebiveis, condicoes:eqCondicoes}[eqTab]();
  document.getElementById('scr-equipe').innerHTML = back('conta','Painel da equipe')+`
    <div class="note" style="margin:0 0 12px">Protótipo da área interna. No sistema real, só a equipe ImportFácil acessa esta tela, com login próprio.</div>
    <div class="seg" role="tablist">${abas.map(([k,t])=>`<button role="tab" aria-selected="${eqTab===k}" class="${eqTab===k?'on':''}" onclick="eqTab='${k}';rEquipe()">${t}</button>`).join('')}</div>
    ${corpo}<div style="height:18px"></div>`;
}

/* ---------- Crédito: análise do cadastro ---------- */
function eqCadastros(){
  if(!cadStatus) return `<div class="card"><div class="empty">Nenhum cadastro aguardando análise.<br>Quando o cliente enviar o cadastro da empresa, ele aparece aqui.</div>
    <button class="btn outline block" onclick="go('cadastro')">Ver o cadastro do lado do cliente</button></div>`;
  const tipo = PERFIS[cad.tipo];
  const chip = cadStatus==='Aprovado'?'ok':/Pendente|Reprovado/.test(cadStatus)?'cancel':'pend';
  const docs = Object.keys(cad.docs||{}).length;
  return `<div class="card">
      <div class="row"><b style="font-size:.9rem">${oesc(cad.razao||'Empresa sem razão social')}</b><span class="chip ${chip}">${cadStatus}</span></div>
      <div class="muted" style="margin:3px 0 8px">CNPJ ${oesc(cad.cnpj||'—')} · ${tipo?tipo.nome:'tipo não informado'} · protocolo ${cad.protocolo||'—'}</div>
      ${[['Limite solicitado', cad.limite?'R$ '+cad.limite:'—'],['Faturamento mensal', cad.fatMensal?'R$ '+cad.fatMensal:'—'],
         ['Condição desejada', cad.condPgto||'—'],['Documentos', docs+' anexado(s)'],['Enviado em', cad.enviadoEm||'—']]
        .map(([k,v])=>`<div class="specrow"><span>${k}</span><span>${oesc(String(v))}</span></div>`).join('')}
    </div>
    <div class="card"><h2 class="h3x">Checklist da análise</h2>
      ${[['CNPJ ativo na Receita Federal','integração pendente'],['Consulta ao bureau de crédito (Serasa / Boa Vista)','integração pendente'],
         ['Documentos do cadastro', docs+' de '+(CAD_DOCS.length+(CAD_DOC_TIPO[cad.tipo]?1:0))+' anexados'],
         ['Referências comerciais (pedir 3)', [cad.ref1,cad.ref2,cad.ref3].filter(Boolean).length+' informada(s)'],
         ['Habilitação no RADAR', cad.docs&&cad.docs.radar?'anexada':'não anexada']]
        .map(([k,v])=>`<div class="specrow"><span>${k}</span><span class="muted">${v}</span></div>`).join('')}
    </div>
    <div class="card"><h2 class="h3x">Decisão de crédito</h2>
      <label for="eqFaixa">Faixa de risco</label>
      <select id="eqFaixa" onchange="cad.faixa=this.value;eqLimRasc=null;rEquipe()">${Object.values(FAIXAS).map(f=>`<option value="${f.nome}" ${faixaAtual().nome===f.nome?'selected':''}>Faixa ${f.nome} · ${f.txt}</option>`).join('')}</select>
      <div class="muted" style="margin-top:4px">${faixaAtual().maxBoleto?'Boleto em até '+faixaAtual().maxBoleto+'× · '+Math.round(faixaAtual().fator*100)+'% do limite da tabela':'Sem boleto: só Pix e cartão'}</div>
      <label for="eqLim">Limite aprovado para boleto (R$)</label>
      <input id="eqLim" type="number" min="0" step="1000" ${faixaAtual().nome==='C'?'disabled':''} oninput="eqLimRasc=this.value" value="${eqLimRasc!=null?eqLimRasc:Math.round(cad.faixaAprov===faixaAtual().nome&&+cad.limiteAprov?+cad.limiteAprov:limiteSugerido(cad.tipo,faixaAtual().nome))}">
      <div class="muted" style="margin-top:4px">Sugerido pela política: ${BRL(limiteSugerido(cad.tipo,faixaAtual().nome))}${tipo?' (2× o pedido mínimo de '+tipo.nome+', faixa '+faixaAtual().nome+')':''}. Pix e cartão não usam o limite.</div>
      ${eqAvisosLimite()}
      <div style="margin-top:12px">${switchHTML('eqCO','Liberar importação por conta e ordem (clientes grandes)',!!cad.contaOrdem,'v=>{eqContaOrdem(v)}')}</div>
      <div class="muted" style="margin-top:2px">${faixaAtual().nome==='A'?'O cliente paga o numerário antes do câmbio e da DUIMP; só a taxa de serviço pode ser parcelada.':'Disponível só para a faixa A.'}</div>
      <button class="btn default block" style="margin-top:12px" onclick="eqAprovar()">${cadStatus==='Aprovado'?'Atualizar limite':'Aprovar crédito'}</button>
      ${cadStatus!=='Aprovado'?`<div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn outline sm" style="flex:1" onclick="eqStatus('Pendente de documentos')">Pedir documentos</button>
        <button class="btn outline sm" style="flex:1" onclick="eqStatus('Reprovado')">Reprovar</button></div>`:''}
    </div>`;
}
let eqLimRasc = null;
const moneyNum = v => parseFloat(String(v||'').replace(/\./g,'').replace(',','.'))||0;
function eqAvisosLimite(){
  const el = document.getElementById('eqLim');
  const v = eqLimRasc!=null ? +eqLimRasc : (cad.faixaAprov===faixaAtual().nome&&+cad.limiteAprov ? +cad.limiteAprov : limiteSugerido(cad.tipo, faixaAtual().nome));
  const fat = moneyNum(cad.fatMensal), av = [];
  if(fat && v > fat*0.10) av.push('Acima de 10% do faturamento mensal declarado ('+BRL(fat*0.10)+').');
  if(v > 100000) av.push('Acima de R$ 100 mil: aprovação da diretoria, balanço e DRE, e garantia (aval, duplicata aceita ou seguro de crédito).');
  return av.length ? `<div class="alert" style="margin-top:8px">⚠️<div><b>Confira antes de aprovar</b>${av.join(' ')}</div></div>` : '';
}
function eqContaOrdem(v){
  if(v && faixaAtual().nome!=='A'){ toast('A conta e ordem é liberada só para clientes da faixa A'); rEquipe(); return; }
  cad.contaOrdem = !!v; rEquipe(); toast(v?'Conta e ordem liberada para este cliente':'Conta e ordem desativada');
}
function eqAprovar(){
  const fx = faixaAtual().nome;
  const v = fx==='C' ? 0 : Math.round(+document.getElementById('eqLim').value||0);
  if(fx!=='C' && v<=0){ toast('Informe um limite maior que zero'); return; }
  cad.faixa = fx; cad.faixaAprov = fx; cad.limiteAprov = v; cadStatus = 'Aprovado'; eqLimRasc = null;
  if(fx!=='A') cad.contaOrdem = false;
  if(cad.tipo && PERFIS[cad.tipo]){ cfg.perfil = cad.tipo; setGreet(); }
  badges(); rEquipe(); toast(fx==='C'?'Cadastro aprovado · faixa C, sem boleto':'Crédito aprovado ✓ · faixa '+fx+' · limite de '+BRL(v)+' no boleto');
}
function eqStatus(st){ cadStatus = st; badges(); rEquipe(); toast('Cadastro: '+st.toLowerCase()); }

/* ---------- Pedidos e ordens de importação ---------- */

  const ocs = ordens.length ? ordens.map(oc=>{const fim = oc.status===OC_ETAPAS[OC_ETAPAS.length-1]||oc.status==='Cancelada', b=bloqueioOC(oc);

      <div class="muted" style="margin-top:6px">Na conta e ordem, o câmbio e a DUIMP esperam o numerário do cliente.</div></div>`;
}
function eqPedAvancar(num){ avancaStatus(pedidos.find(x=>x.num===num)); rEquipe(); }
function eqOcAvancar(num){ if(ocAvanca(ordens.find(x=>x.num===num))) rEquipe(); }

  const agenda = Object.keys(meses).sort((a,b)=>a-b).map(k=>`<div class="specrow"><span>${MES[k%12]} ${Math.floor(k/12)}</span><span>${BRL(meses[k])}</span></div>`).join('');

    <div class="card"><h2 class="h3x">Cartão: repasse da operadora</h2>
      ${cart.length?cart.map(o=>`<div class="specrow"><span>${o.num} · ${o.cartao.n}×</span><span>${BRL(o.cartao.total)}</span></div>`).join(''):'<div class="empty">Nenhuma venda no cartão.</div>'}

        <button class="btn outline sm" onclick="toast('Protótipo: lembrete enviado por e-mail e WhatsApp')">Lembrar</button></div>`).join(''):'<div class="empty">Nenhuma parcela em atraso.</div>'}
      <h2 class="h3x" style="margin-top:12px">Régua de cobrança</h2>
      ${[['3 dias antes do vencimento','Lembrete com a linha digitável e o Pix'],['No vencimento','Lembrete no e-mail e no WhatsApp'],
         ['Mais de 3 dias após','Aviso de atraso com multa e juros; novos pedidos no boleto bloqueados até o pagamento'],
         ['30 dias após','Negativação no Serasa'],['45 dias após','Protesto e revisão da faixa de crédito']]
        .map(([k,v])=>`<div class="specrow"><span>${k}</span><span class="muted" style="text-align:right">${v}</span></div>`).join('')}

function exemploFin(){
  if(!P()){ toast('Escolha o tipo de empresa primeiro'); mostrarPerfil(); return; }
  const mk=(num,cond,itens,diasAtras,status)=>{
    const tot=itens.reduce((s,i)=>s+preco(prodOf(i.pid))*i.qtd,0);
    pedidos.unshift({num, itens, total:tot, frete:0, pgto:cond, status, data:fmtD(addD(D0,-diasAtras)), ref:'',
      por:['Marina Alves','Rogério Pacheco','Cláudia Nunes'][pedidos.length%3], aprov:'Diretoria'});
    gerarParcelas(num, cond, tot, addD(D0,-diasAtras));
  };
  if(perfilKey()==='cooperativa'){
    mk('PED-9101','Boleto 30/60/90 dias',[{pid:1101,qtd:80},{pid:401,qtd:30}],45,5);
    mk('PED-9102','Boleto 30 dias',[{pid:406,qtd:48},{pid:701,qtd:2}],40,5);
    mk('PED-9103','Pix à vista',[{pid:802,qtd:31}],5,3);
  } else {
    // quantidades em múltiplos de venda, ~R$ 6 mil por linha, com itens do catálogo do próprio tipo de cliente
    const base=prodsPerfil().filter(p=>!p.orc&&p.estoque&&p.cat!=='seguranca');
    const linha=(p)=>({pid:p.id, qtd:p.mult*Math.max(1,Math.round(6000/(preco(p)*p.mult))), receb:'d45'});
    const prz=P().prazos[P().prazos.length-1];
    mk('PED-9101','Boleto '+prz,[linha(base[0]),linha(base[4])],45,5);
    mk('PED-9102','Boleto 30 dias',[linha(base[8]),linha(base[12])],40,5);
    mk('PED-9103','Pix à vista',[linha(base[15])],5,3);
  }
  // 1ª do 9101 paga, 9103 pago; 9102 fica em atraso de propósito
  const a=parcelas.filter(p=>p.pedido==='PED-9101').sort((x,y)=>x.venc-y.venc);
  if(a[0]){a[0].pago=true;a[0].pagoEm=fmtD(a[0].venc);}
  parcelas.filter(p=>p.pedido==='PED-9103').forEach(p=>{p.pago=true;p.pagoEm=fmtD(p.venc);});
  pedidos.filter(o=>/^PED-910[123]$/.test(o.num)).forEach(o=>faturar(o,true));
  rFinanceiro(); toast('3 pedidos de exemplo carregados · 1 em atraso, 1 quitado');
}

/* Cada produto recebe ATÉ 3 candidatas do seu conjunto, para você poder
   trocar na revisão. Sem conjunto mapeado → segue na ilustração. */
function aplicarFotosBanco(){
  const usados = {}; let comFoto = 0, comIlu = 0;
  PRODUTOS.forEach(p=>{
    if(p.fotos && p.fotos.some(f=>!f.banco)) return;        // foto real anexada: não mexe
    const k = poolDe(p);
    if(!k){ p.fotos=(p.fotos||[]).filter(f=>!f.banco); p.img=null; p.ilustrativa=false; p.cands=null; comIlu++; return; }
    const pool = PEXELS[k];
    const base = (usados[k] = (usados[k]||0)); usados[k] += 3;
    p.cands = [0,1,2].map(d=>pool[(base+d)%pool.length]);
    p.candIdx = 0;
    const id = p.cands[0];
    p.fotos = [{nome:'pexels-'+id+'.jpeg', meta:'Pexels · '+k, src:pexUrl(id), banco:true}];
    p.img = pexUrl(id); p.ilustrativa = true; comFoto++;
  });
  return {comFoto, comIlu};
}
function trocarFoto(pid){
  const p = prodOf(pid); if(!p||!p.cands) return;
  p.candIdx = (p.candIdx+1) % p.cands.length;
  const id = p.cands[p.candIdx];
  p.fotos = [{nome:'pexels-'+id+'.jpeg', meta:'Pexels · opção '+(p.candIdx+1)+'/'+p.cands.length, src:pexUrl(id), banco:true}];
  p.img = pexUrl(id); p.ilustrativa = true;
}

  p.fotos = (p.fotos||[]).filter(f=>!f.banco);
  p.img = (p.fotos.find(f=>!f.up)||{}).src || null;
  p.ilustrativa = false; p.revisado = true;
}
function limparFotosBanco(){
  let n=0;
  PRODUTOS.forEach(p=>{
    if(!p.fotos) return;

}

   Attachment / AttachmentMedia / AttachmentContent / AttachmentTitle /
   AttachmentDescription / AttachmentActions / AttachmentAction / Group
   Enquanto não há foto, o item usa a ilustração vetorial.

let imgCat = 'epis';
function tamanho(b){ return b>=1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.round(b/1024)+' KB'; }
function extDe(nome){ const m=(nome||'').split('.').pop(); return (m||'IMG').toUpperCase().slice(0,4); }

/* --- bloco Attachment de um produto --- */
function attachOf(p, vertical){
  const fotos = p.fotos||[];
  return fotos.map((f,i)=>`
    <div class="att" data-orientation="${vertical?'vertical':'horizontal'}" data-state="${f.up?'uploading':'idle'}">
      <div class="att-media" ${f.up?'':'data-variant="image"'}>
        ${f.up ? '<span class="spinner"></span>' : `<img src="${f.src}" alt="${p.nome}">`}
      </div>
      <div class="att-content">
        <div class="att-title">${f.nome}</div>
        <div class="att-description">${f.up ? 'Enviando · '+f.pct+'%' : f.meta}</div>
        ${f.up?`<div class="att-progress"><i style="width:${f.pct}%"></i></div>`:''}
      </div>
      <div class="att-actions">
        <button class="att-action" aria-label="${f.up?'Cancelar envio':'Remover '+f.nome}" onclick="removeFoto(${p.id},${i})">${I('x')}</button>
      </div>
    </div>`).join('');
}
function dropOf(pid){
  return `<label class="att-drop">${I('upload')} Anexar foto do produto
    <input type="file" accept="image/*" multiple onchange="addFotos(${pid},this)">
  </label>`;
}

/* --- upload simulado com progresso --- */
function addFotos(pid, input){
  const p = prodOf(pid); if(!p) return;
  p.fotos = p.fotos||[];
  [...input.files].forEach(file=>{
    const f = {nome:file.name.length>26?file.name.slice(0,24)+'…':file.name,
               meta: extDe(file.name)+' · '+tamanho(file.size),
               src: URL.createObjectURL(file), up:true, pct:0};
    p.fotos.push(f);
    const t = setInterval(()=>{
      f.pct = Math.min(100, f.pct + 12 + Math.round(Math.random()*14));
      if(f.pct>=100){ clearInterval(t); f.up=false; if(!p.img) p.img=f.src; toast('Foto anexada a '+p.cod+' ✓'); }
      refreshFotos(pid);
    }, 140);
  });
  input.value='';
  refreshFotos(pid);
}
function removeFoto(pid, i){
  const p = prodOf(pid); if(!p||!p.fotos) return;
  const [f] = p.fotos.splice(i,1);
  if(p.img===f.src) p.img = (p.fotos.find(x=>!x.up)||{}).src || null;
  refreshFotos(pid);
  toast(p.fotos.length?'Foto removida':'Sem fotos — o item volta a usar a ilustração');
}
function refreshFotos(pid){
  const box = document.getElementById('fotos_'+pid);
  if(box) box.innerHTML = attachOf(prodOf(pid), true) + dropOf(pid);
  if(cur==='imagens') pintarImagens();
  if(cur==='produto' || cur==='categoria') render(cur);
}

/* --- importação em lote: casa o arquivo com o código do produto --- */
const iniciais = n => (n||'?').trim().split(/\s+/).map(x=>x[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
/* Avatar: usa AvatarImage quando há src, senão AvatarFallback com as iniciais */
function avatarHTML(nome, o){
  o = o || {};
  const cls = ['avatar', o.sq?'sq':'', o.size||'', o.brand?'brandish':''].filter(Boolean).join(' ');
  const dentro = o.src
    ? `<img src="${o.src}" alt="${oesc(nome)}" onerror="this.outerHTML='<span class=\\'avatar-fallback\\'>${oesc(iniciais(nome))}</span>'">`
    : `<span class="avatar-fallback">${iniciais(nome)}</span>`;
  return `<span class="${cls}" title="${oesc(nome)}">${dentro}</span>`;
}
const normCod = t => (t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function acharPorArquivo(nomeArq){
  const base = normCod(nomeArq.replace(/\.[^.]+$/,''));
  // casa o maior código que seja prefixo do nome do arquivo
  return PRODUTOS
    .filter(p => base.startsWith(normCod(p.cod)))
    .sort((a,b) => normCod(b.cod).length - normCod(a.cod).length)[0] || null;
}
function importarLote(input){
  const arquivos=[...input.files]; input.value='';
  if(!arquivos.length) return;
  let ok=0; const semPar=[];
  arquivos.forEach(file=>{
    const p = acharPorArquivo(file.name);
    if(!p){ semPar.push(file.name); return; }
    p.fotos = p.fotos||[];
    const f={nome:file.name.length>26?file.name.slice(0,24)+'…':file.name,
             meta: extDe(file.name)+' · '+tamanho(file.size),
             src: URL.createObjectURL(file), up:true, pct:0};
    p.fotos.push(f); ok++;
    const t=setInterval(()=>{
      f.pct=Math.min(100,f.pct+22+Math.round(Math.random()*18));
      if(f.pct>=100){ clearInterval(t); f.up=false; if(!p.img) p.img=f.src; }
      if(cur==='imagens') pintarImagens();
    },120);
  });
  if(cur==='imagens') pintarImagens();
  setTimeout(()=>{
    toast(ok+' foto(s) ligada(s) pelo código'+(semPar.length?' · '+semPar.length+' sem correspondência':' ✓'));
    if(semPar.length) sheetSemPar(semPar);
  }, 900);
}
function sheetSemPar(lista){
  openSheet(`
    <h2>Arquivos sem correspondência</h2>
    <div class="muted" style="margin-bottom:10px">Estes ${lista.length} arquivos não casaram com nenhum código do catálogo. Renomeie usando o código do produto e importe de novo.</div>
    <div class="att-group">${lista.slice(0,12).map(n=>`
      <div class="att"><div class="att-media">${I('image')}</div>
        <div class="att-content"><div class="att-title">${n}</div>
        <div class="att-description">sem produto correspondente</div></div></div>`).join('')}</div>
    ${lista.length>12?`<div class="muted" style="margin-top:8px">e mais ${lista.length-12}…</div>`:''}
    <button class="btn default block" style="margin-top:14px" onclick="closeSheet()">Entendi</button>`);
}

/* ================= Acessibilidade em tempo de execução =================
   Complementa o HTML gerado: associa rótulos a campos, dá nome a controles,
   torna cartões clicáveis operáveis por teclado e foca regiões roláveis. */
let _a11yN=0;
function a11yAplicar(raiz){
  if(!raiz||raiz.nodeType!==1) return;
  const q=sel=>[...(raiz.matches&&raiz.matches(sel)?[raiz]:[]),...raiz.querySelectorAll(sel)];
  // 1) rótulos -> campos
  q('label').forEach(l=>{
    if(l.htmlFor||l.querySelector('input,select,textarea')) return;
    let c=l.nextElementSibling;
    while(c && !c.matches('input,select,textarea') && !c.querySelector('input,select,textarea')) { c=c.nextElementSibling; if(c&&c.tagName==='LABEL') {c=null;break;} }
    if(c && !c.matches('input,select,textarea')) c=c.querySelector('input,select,textarea');
    if(!c){ const f=l.closest('.fld,.form-group,.fr'); c=f&&f.querySelector('input,select,textarea'); }
    if(!c || c.type==='checkbox' || c.type==='radio') return;
    if(!c.id) c.id='a11y-'+(++_a11yN);
    l.htmlFor=c.id;
  });
  // 2) campos sem nome acessível
  q('input,select,textarea').forEach(c=>{
    if(c.type==='hidden'||c.type==='checkbox'||c.type==='radio') return;
    if(c.getAttribute('aria-label')||c.getAttribute('aria-labelledby')) return;
    if(c.labels&&c.labels.length) return;
    let nome=c.getAttribute('placeholder')||c.getAttribute('title')||'';
    if(!nome){ const f=c.closest('.fld,.form-group,.fr,.card'); const l=f&&f.querySelector('label,.wlabel,.h3x'); nome=l?l.textContent:''; }
    if(!nome && c.tagName==='SELECT') nome='Selecione uma opção';
    if(!nome && c.tagName==='INPUT') nome='Campo de texto';
    c.setAttribute('aria-label',nome.replace('*','').trim());
  });
  // 3) cartões/linhas clicáveis -> teclado
  q('[onclick]').forEach(e=>{
    if(e.matches('button,input,select,textarea,summary,label')||e.hasAttribute('data-kb')) return;
    if(e.tagName==='A'&&e.getAttribute('href')&&e.getAttribute('href')!=='#') return;
    if(e.closest('.stepper')||e.classList.contains('sheet-bg')||e.classList.contains('overlay')||e.classList.contains('backdrop')) return;
    const aninhado=!!e.querySelector('button,a[href],input,select,textarea,[data-kb]');
    if(!e.getAttribute('role')) e.setAttribute('role',aninhado||e.tagName==='A'?'link':'button');
    if(!e.hasAttribute('tabindex')) e.setAttribute('tabindex','0');
    e.setAttribute('data-kb','1');
  });
  // 4) regiões roláveis
  q('.ui-table-wrap,.od-scroll,.hscroll,.chiprow').forEach(e=>{ if(!e.hasAttribute('tabindex')&&e.scrollWidth>e.clientWidth+2){ e.setAttribute('tabindex','0'); if(!e.getAttribute('role')) e.setAttribute('role','group'); if(!e.getAttribute('aria-label')) e.setAttribute('aria-label','Conteúdo rolável'); }});
  // 5) imagens decorativas sem alt
  q('img:not([alt])').forEach(i=>i.setAttribute('alt',''));
}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.hasAttribute&&t.hasAttribute('data-kb')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); t.click(); }
});
new MutationObserver(ms=>{ ms.forEach(m=>m.addedNodes.forEach(n=>a11yAplicar(n))); }).observe(document.body,{childList:true,subtree:true});
a11yAplicar(document.body);

/* ================= Persistência (localStorage) =================
   Guarda o estado do protótipo neste navegador. Nunca guarda senha.
   Se o armazenamento estiver bloqueado, o app funciona normalmente (sem salvar). */
const LS_KEY='importfacil.estado.v1';
function lsGet(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY,v); return true; }catch(e){ return false; } }
function lsDel(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }
function estadoJSON(){
  return JSON.stringify({v:1,cfg,carrinho,qtdSel,recebSel,recentes,favoritos,pedidos,orcamentos,ordens,contatos,cad,cadStatus,cadStep,parcelas,orc,politica,
    ui:{perfilDemo:!!cfg.perfil}}, function(k,v){ return (this[k] instanceof Date)?{$d:this[k].toISOString()}:v; });
}
let _ultimoSalvo='';
function salvarEstado(){
  if(!cfg.logged) return;
  const j=estadoJSON(); if(j===_ultimoSalvo) return;
  if(lsSet(j)) _ultimoSalvo=j;
}
function restaurarEstado(){
  const raw=lsGet(); if(!raw) return false;
  try{
    const d=JSON.parse(raw,(k,v)=> (v&&typeof v==='object'&&v.$d)?new Date(v.$d):v);
    if(!d||d.v!==1||!d.cfg||!d.cfg.logged) return false;
    delete d.cfg.senha;
    Object.assign(cfg,d.cfg);
    recentes=d.recentes||[]; carrinho=d.carrinho||[]; qtdSel=d.qtdSel||{}; recebSel=d.recebSel||{};
    favoritos=d.favoritos||[]; pedidos=d.pedidos||[]; orcamentos=d.orcamentos||[]; ordens=d.ordens||[];
    contatos=d.contatos||[]; cad=d.cad||{tipo:'',docs:{}}; cadStatus=d.cadStatus||null; cadStep=d.cadStep||1;
    parcelas=d.parcelas||[]; orc=d.orc||null;
    if(d.politica){ const pv=d.politica; if((pv.ver||1)<2){ delete pv.cartaoSemJurosAte; pv.ver=2; } Object.assign(politica,pv); }
    if(cfg.perfil && !PERFIS[cfg.perfil]) cfg.perfil=null;
    return true;
  }catch(e){ lsDel(); return false; }
}
function sairConta(){
  lsDel(); _ultimoSalvo='';
  cfg.logged=false; // impede regravação em pagehide
  location.reload();
}
function limparDadosPrototipo(){ sairConta(); }
window.addEventListener('pagehide',salvarEstado);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') salvarEstado(); });
setInterval(salvarEstado,2000);

  if(cfg.perfil){ setGreet(); badges(); renderSidebar(); render('home'); }

} else { mostrarLogin(); render('home'); }
