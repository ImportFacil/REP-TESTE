  #loginscr{
    /* 100% de largura garante a marca inteira em qualquer tela; a cor continua a areia */
    background:var(--login-tall) top center/100% auto no-repeat;
    background-color:#726252;
  }
  #loginscr .login-wrap{justify-content:flex-end;padding:24px 20px 30px;gap:14px}
  #loginscr .ui-card{
    --background:#ffffff; --card:#ffffff; --popover:#ffffff; --field:#ffffff;
    --foreground:#1b1a18; --card-foreground:#1b1a18; --popover-foreground:#1b1a18;
    --muted-foreground:#6c665f;
    --border:#e7e3dc; --input:#dcd6cd;
    --accent:#f5f2ed; --accent-foreground:#1b1a18;
    --secondary:#f5f2ed; --secondary-foreground:#1b1a18;
    --primary:#111111; --primary-foreground:#ffffff;
    --ring:#111111;
    --shadow-xs:0 1px 2px rgba(27,26,24,.06);
    background:#ffffff; color:#1b1a18;
    border:1px solid rgba(255,255,255,.6); border-radius:20px;
    box-shadow:0 28px 60px -30px rgba(26,22,18,.75), 0 2px 10px -4px rgba(26,22,18,.25);
  }
  #loginscr .ui-card .card-title{color:#1b1a18}
  #loginscr .ui-card label{color:#55504a}
  #loginscr .ui-card .lnk-underline{color:#1b1a18}
  #loginscr .ui-card .btn.link{color:#111111}
  #loginscr .ui-card .btn.default:hover{background:#2a2a2a}

  main:has(> #scr-home.active){background:var(--cab-verde)}
  body:has(#scr-home.active) header,
  body:has(#scr-home.active) #statusbar{background:var(--cab-creme) center top/cover no-repeat, #fbf5ea;color:#1b1a18}
  body:has(#scr-home.active) header .brand,
  body:has(#scr-home.active) header .hbtn:not(.sb-trigger){color:#1b1a18}
  body:has(#scr-home.active) header .sub{opacity:.72}
  body:has(#scr-home.active) header{border-bottom:0}
  body:has(#scr-home.active) header .hbtn.burger-btn:hover{background:rgba(27,26,24,.07)}
  /* Menu hambúrguer marrom (ícone e círculo): onde o cabeçalho é claro, isto é, na inicial do celular e em todas as páginas do desktop */
  :root{ --menu-marrom:#5b4334; }
  body:not([data-theme="dark"]):has(#scr-home.active) header .hbtn.burger-btn{color:var(--menu-marrom)}
  @media (min-width:1024px){ body:not([data-theme="dark"]) header .hbtn.burger-btn{color:var(--menu-marrom)} }
  body:has(#scr-home.active) #statusbar{background-position:center top}
  body[data-theme="dark"] main:has(> #scr-home.active){
    background:linear-gradient(rgba(22,21,19,.80),rgba(22,21,19,.80)), var(--cab-verde)}
  body[data-theme="dark"]:has(#scr-home.active) header,
  body[data-theme="dark"]:has(#scr-home.active) #statusbar{
    background:linear-gradient(rgba(22,21,19,.80),rgba(22,21,19,.80)), var(--cab-creme) center top/cover no-repeat, #1d1c1a;color:#f2efe9}
  body[data-theme="dark"]:has(#scr-home.active) header .brand,
  body[data-theme="dark"]:has(#scr-home.active) header .hbtn:not(.sb-trigger){color:#f2efe9}
  /* contraste do texto solto sobre o cinza */
  body:not([data-theme="dark"]) #scr-home > .muted{color:#4f4a45}
  body:not([data-theme="dark"]) #scr-home .section-title{color:#1f1d1b}
  body:not([data-theme="dark"]) #scr-home .section-title a{color:#1f1d1b;text-decoration:underline;text-underline-offset:3px}

  /* ===== Menu hambúrguer: três linhas dentro de um círculo, abre e fecha ===== */
  @media (max-width:1023px){ header .hbtn.sb-trigger{display:none} }   /* o atalho da sidebar só existe no desktop */
  header .hbtn.burger-btn{width:30px;height:30px;padding:0;border-radius:999px;border:1.5px solid currentColor;flex:none}
  header .hbtn.burger-btn:hover{background:rgba(255,255,255,.14)}
  header .hbtn.burger-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
  .burger{position:relative;display:block;width:13px;height:9.5px}
  .burger i{position:absolute;left:0;right:0;height:1.6px;border-radius:2px;background:currentColor;
    transition:top .2s ease,transform .22s ease,opacity .15s ease}
  .burger i:nth-child(1){top:0}
  .burger i:nth-child(2){top:3.95px}
  .burger i:nth-child(3){top:7.9px}
  .burger-btn[aria-expanded="true"] .burger i:nth-child(1){top:3.95px;transform:rotate(45deg)}
  .burger-btn[aria-expanded="true"] .burger i:nth-child(2){opacity:0}
  .burger-btn[aria-expanded="true"] .burger i:nth-child(3){top:3.95px;transform:rotate(-45deg)}
  .menu-scrim{position:absolute;inset:0;z-index:64;background:rgba(20,18,16,.32);opacity:0;pointer-events:none;transition:opacity .2s}
  .menu-scrim.open{opacity:1;pointer-events:auto}
  .menu-panel{position:absolute;z-index:65;right:12px;width:min(300px,calc(100% - 24px));
    background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);
    box-shadow:0 24px 50px -20px rgba(0,0,0,.45);padding:8px;overflow-y:auto;
    opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;visibility:hidden;
    transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
  .menu-panel.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .18s ease,transform .18s ease}
  .menu-group + .menu-group{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
  .menu-label{font-size:.66rem;font-weight:500;color:var(--muted-foreground);padding:6px 10px 4px}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:none;background:none;
    border-radius:var(--radius-md);font:inherit;font-size:.84rem;font-weight:500;color:inherit;cursor:pointer;text-align:left}
  .menu-item:hover,.menu-item:focus-visible{background:var(--accent);color:var(--accent-foreground);outline:none}
  .menu-item[aria-current="page"]{background:var(--accent);font-weight:600}
  .menu-item .svgi{width:17px;height:17px;flex:none;color:var(--muted-foreground)}
  .menu-item[aria-current="page"] .svgi{color:var(--foreground)}
  .menu-item span{flex:1}
  .menu-item .menu-badge{flex:none;font-size:.66rem;font-weight:600;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
    background:var(--muted);color:var(--foreground);display:flex;align-items:center;justify-content:center}

  #perfilscr{background:var(--seg-bg) center/cover no-repeat;background-color:#5b4334}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .seg-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 30px;gap:20px}
  .seg-title{width:min(80%,430px);margin-top:auto;filter:drop-shadow(0 2px 14px rgba(40,22,12,.35))}
  .seg-title svg{width:100%;height:auto;display:block}
  .seg-glass{width:100%;max-width:25rem;margin-bottom:auto;padding:14px;border-radius:22px;
    background:rgba(238,231,223,.10);border:1.5px solid #eee7df;
    -webkit-backdrop-filter:blur(18px) saturate(1.05);backdrop-filter:blur(18px) saturate(1.05);
    box-shadow:0 24px 60px -30px rgba(30,16,8,.7);display:flex;flex-direction:column;gap:9px}
  /* ===== Item (anatomia shadcn: Item / ItemMedia / ItemContent / ItemTitle / ItemDescription / ItemActions) ===== */
  .item-group{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:16px;     /* size: default → p-4 gap-4 */
    border:1px solid transparent;border-radius:var(--radius-md);background:transparent;color:var(--foreground);
    font-size:.875rem;font-family:inherit;text-align:left;text-decoration:none;width:100%;
    outline:none;transition:background-color .1s,border-color .1s,box-shadow .1s}
  .item[data-variant="outline"]{border-color:var(--border)}
  .item[data-variant="muted"]{background:color-mix(in oklab,var(--muted) 50%,transparent)}
  .item[data-size="sm"]{padding:12px 16px;gap:10px}                                /* size: sm → py-3 px-4 gap-2.5 */
  a.item,button.item{cursor:pointer}
  a.item:hover,button.item:hover{background:color-mix(in oklab,var(--accent) 50%,transparent)}
  .item:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
  .item-media{display:flex;flex-shrink:0;align-items:center;justify-content:center;gap:8px}
  .item:has(.item-description) .item-media{align-self:flex-start;transform:translateY(2px)}
  .item-media .svgi{pointer-events:none}
  .item-media[data-variant="icon"]{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--muted)}
  .item-media[data-variant="icon"] .svgi{width:16px;height:16px}
  .item-content{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}
  .item-title{display:flex;width:fit-content;align-items:center;gap:8px;font-size:.875rem;line-height:1.375;font-weight:500}
  .item-description{color:var(--muted-foreground);font-size:.875rem;line-height:1.5;font-weight:400;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-actions{display:flex;align-items:center;gap:8px}
  .item-actions .svgi{width:16px;height:16px}
  /* itens da tela de segmento: brancos sobre o vidro, como o board do login */
  .seg-glass .item-group{gap:8px}
  .seg-glass .item{
    --background:#ffffff; --foreground:#1b1a18; --muted:#f3f0eb; --muted-foreground:#6c665f;
    --accent:#efe9e1; --border:#e4dfd7; --ring:#111111;
    background:#ffffff;box-shadow:0 1px 2px rgba(27,26,24,.08)}
  .seg-glass .item:hover{background:#f7f4ef}
  .seg-glass .item[aria-current="true"]{border-color:#111111}
  .seg-glass .item .item-actions{color:#6c665f}
  .seg-glass .item[aria-current="true"] .item-actions{color:#111111}
  .seg-glass .item-description span{display:block}
  .seg-cancel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(238,231,223,.75);
    height:38px;border-radius:10px;font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer;margin-top:2px}
  .seg-cancel:hover{background:rgba(255,255,255,.2)}
  #loginscr > .login-wrap > .muted{
    color:rgba(255,255,255,.88); text-shadow:0 1px 10px rgba(30,24,18,.6); font-size:.74rem; line-height:1.5;
  }

    --warn-bg: oklch(0.3267 0.0508 94.16);  --warn-fg: oklch(0.8500 0.1200 90.00);
    --bad-bg:  oklch(0.2764 0.0637 17.74);  --bad-fg:  oklch(0.7600 0.1300 20.00);
    --info-bg: oklch(0.3109 0.0625 251.22); --info-fg: oklch(0.8000 0.0900 253.00);
  }
  /* aliases usados pelo protótipo → apontam para os tokens shadcn */
  :root, .dark, body[data-theme="dark"]{
    --page: var(--background);  --surface: var(--card);
    --ink: var(--foreground);   --ink-2: var(--muted-foreground); --ink-3: var(--muted-foreground);
    --hairline: var(--border);  --green-txt: var(--success);
    --primary-light: var(--primary-soft); --primary-dark: var(--primary-deep);
    --good: var(--success); --critical: var(--destructive); --wash-blue: var(--wash);
    --chip-ok-bg: var(--ok-bg);     --chip-ok-tx: var(--ok-fg);
    --chip-pend-bg: var(--warn-bg); --chip-pend-tx: var(--warn-fg);
    --chip-cancel-bg: var(--bad-bg);--chip-cancel-tx: var(--bad-fg);
    --chip-blue-bg: var(--info-bg); --chip-blue-tx: var(--info-fg);
    --alert-bg: var(--warn-bg); --alert-bd: var(--border); --alert-tx: var(--warn-fg); --alert-b: var(--warn-fg);
    --series1: var(--chart-1); --series2: var(--chart-2);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  html[data-big]{font-size:17.5px}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#20242b; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 0;
  }
  #phone{
    width:390px; height:820px; background:var(--page);
    border-radius:38px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 10px #0c0e12, 0 0 0 12px #2e333c;
    display:flex; flex-direction:column;
  }
  @media (max-width:480px), (max-height:880px){
    body{padding:0}
    #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  }

  #statusbar{
    height:34px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; font-size:.72rem; font-weight:600; flex:none;
  }
  body[data-theme="dark"] #statusbar, body[data-theme="dark"] header{background:#10233c}
  header{background:var(--primary); color:#fff; padding:8px 12px 10px 14px; flex:none}
  header .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  header .brand{display:flex;align-items:center;gap:9px;min-width:0}
  header .logo{width:32px;height:32px;border-radius:9px;flex:none}
  header h1{font-size:1rem;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:.63rem;opacity:.85;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  header .hbtn{position:relative;cursor:pointer;background:none;border:none;color:#fff;padding:4px;display:flex;align-items:center;justify-content:center}
  header .hbtn .svgi{width:21px;height:21px}
  header .hbtn .dot{position:absolute;top:-2px;right:-4px;background:#eb6834;color:#fff;font-size:.56rem;font-weight:700;border-radius:999px;padding:1px 5px}
  .searchbar{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 11px;margin-top:9px;cursor:pointer;box-shadow:var(--shadow-xs)}
  .searchbar .svgi{width:16px;height:16px;color:var(--muted-foreground);flex:none}
  .searchbar span{font-size:.8rem;color:var(--muted-foreground)}
  .searchbar input{border:none;background:none;outline:none;box-shadow:none;font-size:.84rem;width:100%;font-family:inherit;color:var(--foreground);padding:0}
  .app-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  /* ===== Sidebar (anatomia shadcn) ===== */
  #phone{--sidebar-width:16rem;--sidebar-width-icon:3.25rem;--sb-w:0px}
  #sidebar{display:none;flex-direction:column;flex:none;position:relative;
    width:var(--sidebar-width);background:var(--sidebar);color:var(--sidebar-foreground);
    border-right:1px solid var(--sidebar-border);transition:width .2s ease}
  #sidebar[data-state="collapsed"]{width:var(--sidebar-width-icon)}
  .sb-header{padding:8px;border-bottom:1px solid var(--sidebar-border)}
  .sb-content{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
  .sb-content::-webkit-scrollbar{display:none}
  .sb-footer{padding:8px;border-top:1px solid var(--sidebar-border)}
  .sb-group{display:flex;flex-direction:column;gap:2px}
  .sb-group-label{font-size:.68rem;font-weight:500;color:var(--sidebar-foreground);opacity:.55;padding:4px 8px}
  .sb-menu{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
  .sb-btn{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;border:none;background:none;
    border-radius:var(--radius-md);font-size:.82rem;font-weight:500;color:var(--sidebar-foreground);
    cursor:pointer;font-family:inherit;text-align:left;transition:.12s}
  .sb-btn:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
  .sb-btn[data-active="true"]{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
  .sb-btn .svgi{width:16px;height:16px;flex:none}
  .sb-btn>span:not(.sb-badge):not(.avatar){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  #sidebar[data-state="collapsed"] .sb-btn>span:not(.avatar){display:none}
  .sb-badge{margin-left:auto;font-size:.66rem;font-weight:600;min-width:19px;height:19px;padding:0 5px;
    border-radius:var(--radius-sm);background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);
    display:flex;align-items:center;justify-content:center;flex:none}
  .sb-badge.warn{background:var(--destructive);color:#fff}
  .sb-brand{display:flex;align-items:center;gap:9px;padding:6px 8px;height:40px}
  .sb-brand .mark{width:28px;height:28px;border-radius:var(--radius-md);flex:none}
  .sb-brand-text{min-width:0}
  .sb-brand-text b{display:block;font-size:.84rem;line-height:1.15}
  .sb-brand-text span{display:block;font-size:.68rem;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-rail{position:absolute;top:0;right:-8px;width:16px;height:100%;border:none;background:none;cursor:ew-resize;z-index:5;padding:0}
  .sb-rail:hover::after{content:"";position:absolute;top:0;left:7px;width:2px;height:100%;background:var(--sidebar-border)}
  #sidebar[data-state="collapsed"] .sb-group-label,
  #sidebar[data-state="collapsed"] .sb-btn>span,
  #sidebar[data-state="collapsed"] .sb-badge,
  #sidebar[data-state="collapsed"] .sb-brand-text{display:none}
  #sidebar[data-state="collapsed"] .sb-btn,
  #sidebar[data-state="collapsed"] .sb-brand{justify-content:center;padding:0}
  /* ===== Attachment (anatomia shadcn) ===== */
  .att-group{display:flex;flex-direction:column;gap:10px}
  .att{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);padding:8px;position:relative;box-shadow:var(--shadow-xs)}
  .att[data-orientation="vertical"]{flex-direction:column;align-items:stretch;padding:0;overflow:hidden}
  .att[data-state="uploading"]{opacity:.75}
  .att-media{width:40px;height:40px;flex:none;border-radius:var(--radius-md);background:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted-foreground)}
  .att-media .svgi{width:18px;height:18px}
  .att[data-orientation="vertical"] .att-media{width:100%;height:132px;border-radius:0;background:linear-gradient(135deg,var(--thumb-a),var(--thumb-b))}
  .att-media img{width:100%;height:100%;object-fit:cover;display:block}
  .att-content{flex:1;min-width:0;display:grid;gap:2px}
  .att[data-orientation="vertical"] .att-content{padding:9px 10px 11px}
  .att-title{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}
  .att-description{font-size:.7rem;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att-actions{display:flex;gap:4px;margin-left:auto;flex:none}
  .att[data-orientation="vertical"] .att-actions{position:absolute;top:7px;right:7px}
  .att-progress{height:3px;background:var(--muted);border-radius:99px;overflow:hidden;margin-top:5px}
  .att-progress i{display:block;height:100%;background:var(--primary);transition:width .15s}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .att-drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--input);border-radius:var(--radius-lg);background:var(--card);padding:14px;cursor:pointer;position:relative;font-size:.8rem;font-weight:500;color:var(--muted-foreground)}
  .att-drop:hover{background:var(--accent);color:var(--accent-foreground)}
  .att-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .sb-trigger{display:none}
  main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 92px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .screen{display:none;animation:fade .18s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .card .h3x{font-size:.72rem;color:var(--muted-foreground);font-weight:600;margin-bottom:9px;text-transform:uppercase;letter-spacing:.6px}
  .muted{color:var(--ink-3);font-size:.76rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .pos{color:var(--green-txt)} .neg{color:var(--critical)}
  .section-title{font-size:.94rem;font-weight:800;margin:16px 2px 9px;display:flex;align-items:center;justify-content:space-between}
  .section-title a{font-size:.72rem;color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
  .empty{color:var(--ink-3);font-size:.78rem;text-align:center;padding:22px 0}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .backrow button{border:none;background:none;font-size:1.4rem;cursor:pointer;color:var(--primary);min-width:40px;min-height:40px;margin-left:-8px}
  .backrow b{font-size:.96rem}
  /* ===== Banner / hero ===== */
  .hero{background:linear-gradient(135deg,var(--hero-from),var(--hero-to));color:var(--hero-fg);border-radius:var(--radius-xl);padding:16px;margin-bottom:12px}
  .hero b{font-size:.96rem;display:block}
  .hero .d{font-size:.74rem;opacity:.9;margin-top:3px}
  .hero .tagline{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 9px;font-size:.62rem;font-weight:700;margin-bottom:7px}
  /* ===== Categorias ===== */
  .catcell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-xs);transition:.15s}
  .catcell:hover{background:var(--accent);border-color:var(--ring)}
  .catcell .svgi{width:23px;height:23px;color:var(--primary)}
  .catcell span{font-size:.63rem;font-weight:600;color:var(--ink-2);line-height:1.15}
  /* ===== Produto ===== */
  .svgi{width:22px;height:22px;flex:none}
  .thumb{background:linear-gradient(135deg,var(--thumb-a),var(--thumb-b));border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .thumb .svgi{color:var(--primary);opacity:.55}
  .thumb .ilu{color:var(--primary);opacity:.65}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .chip.imp{background:var(--brand);color:#fff}
  #scr-produto > .thumb .svgi{width:68px;height:68px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow-xs);transition:box-shadow .15s}
  .pcard:hover{box-shadow:var(--shadow-sm)}
  .pcard .thumb{height:92px;border-radius:0}
  .pcard .thumb .svgi{width:34px;height:34px}
  .pcard .body{padding:9px;display:flex;flex-direction:column;gap:3px;flex:1}
  .pcard .nm{font-size:.74rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .br{font-size:.62rem;color:var(--ink-3)}
  .pcard .dsc{font-size:.63rem;color:var(--ink-3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .tb{font-size:.63rem;color:var(--ink-3);text-decoration:line-through}
  .pcard .pr{font-size:.88rem;font-weight:800;color:var(--ink)}
  .pcard .un{font-size:.6rem;color:var(--ink-3);font-weight:500}
  .plist{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hairline);cursor:pointer;align-items:center}
  .plist:last-child{border-bottom:none}
  .plist .thumb{width:54px;height:54px;flex:none}
  .plist .thumb .svgi{width:24px;height:24px}
  .plist .info{flex:1;min-width:0}
  .plist .nm{font-size:.8rem;font-weight:600;line-height:1.25}
  .chip{display:inline-flex;align-items:center;font-size:.64rem;font-weight:500;border-radius:var(--radius-sm);padding:2px 8px;border:1px solid transparent;line-height:1.35}
  .chip.ok{background:var(--chip-ok-bg);color:var(--chip-ok-tx)}
  .chip.pend{background:var(--chip-pend-bg);color:var(--chip-pend-tx)}
  .chip.cancel{background:var(--chip-cancel-bg);color:var(--chip-cancel-tx)}
  .chip.blue{background:var(--chip-blue-bg);color:var(--chip-blue-tx)}
  .chip.orc{background:var(--brand);color:var(--brand-foreground)}
  .badge-desc{position:absolute;top:6px;left:6px;background:var(--success);color:var(--primary-foreground);font-size:.6rem;font-weight:600;border-radius:var(--radius-sm);padding:2px 6px}
  .plist .thumb .badge-desc{display:none}
  /* ===== Button (shadcn: variant + size) ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    white-space:nowrap;border-radius:var(--radius-md);
    font-size:.84rem;font-weight:500;font-family:inherit;line-height:1;
    height:36px;padding:0 16px;                 /* size: default */
    border:1px solid transparent;background:transparent;color:inherit;
    cursor:pointer;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s;
    outline:none;flex-shrink:0;
  }
  .btn:has(>svg){padding:0 12px}
  .btn .svgi{width:16px;height:16px;pointer-events:none;flex:none}
  .btn:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
  .btn:disabled{opacity:.5;pointer-events:none}
  /* variantes */
  .btn.default{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-xs)}
  .btn.default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}
  .btn.destructive{background:var(--destructive);color:#fff;box-shadow:var(--shadow-xs)}
  .btn.destructive:hover{background:color-mix(in oklab,var(--destructive) 90%,transparent)}
  .btn.destructive:focus-visible{box-shadow:0 0 0 3px color-mix(in oklab,var(--destructive) 40%,transparent)}
  .btn.outline{border-color:var(--border);background:var(--background);color:var(--foreground);box-shadow:var(--shadow-xs)}
  .btn.outline:hover{background:var(--accent);color:var(--accent-foreground)}
  .btn.secondary{background:var(--secondary);color:var(--secondary-foreground);box-shadow:var(--shadow-xs)}
  .btn.secondary:hover{background:color-mix(in oklab,var(--secondary) 80%,transparent)}
  .btn.ghost{background:transparent;color:var(--foreground)}
  .btn.ghost:hover{background:var(--accent);color:var(--accent-foreground)}
  .btn.link{color:var(--primary);padding:0 8px;text-underline-offset:4px;box-shadow:none}
  .btn.link:hover{text-decoration:underline}
  .btn.brand{background:var(--brand);color:var(--brand-foreground);box-shadow:var(--shadow-xs)}
  .btn.brand:hover{background:color-mix(in oklab,var(--brand) 90%,transparent)}
  .btn.success{background:var(--success);color:#fff;box-shadow:var(--shadow-xs)}
  .btn.success:hover{background:color-mix(in oklab,var(--success) 90%,transparent)}
  /* tamanhos */
  .btn.sm{height:32px;padding:0 12px;gap:6px;font-size:.78rem;border-radius:var(--radius-sm)}
  .btn.sm:has(>svg){padding:0 10px}
  .btn.lg{height:40px;padding:0 24px;font-size:.88rem}
  .btn.lg:has(>svg){padding:0 16px}
  .btn.icon{width:36px;height:36px;padding:0}
  .btn.icon.sm{width:32px;height:32px}
  .btn.block{width:100%}
  /* ícone isolado = Button variant="outline" size="icon" */
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:var(--radius-md);
    background:var(--background);color:var(--foreground);box-shadow:var(--shadow-xs);
    cursor:pointer;transition:background-color .15s;outline:none}
  .iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
  .iconbtn:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
  .iconbtn .svgi{width:16px;height:16px}
  .att-action{display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:color-mix(in oklab,var(--card) 88%,transparent);color:var(--foreground);cursor:pointer}
  .att-action:hover{background:var(--accent)}
  .att-action .svgi{width:14px;height:14px}
  /* ===== Avatar (shadcn) ===== */
  .avatar{position:relative;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;flex:none;overflow:hidden;border-radius:9999px}
  .avatar img{aspect-ratio:1/1;width:100%;height:100%;object-fit:cover;display:block}
  .avatar-fallback{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
    background:var(--muted);color:var(--muted-foreground);font-size:.72rem;font-weight:500;border-radius:inherit}
  .avatar.sq{border-radius:var(--radius-lg)}          /* className="rounded-lg" */
  .avatar.sm{width:24px;height:24px}
  .avatar.sm .avatar-fallback{font-size:.6rem}
  .avatar.lg{width:44px;height:44px}
  .avatar.lg .avatar-fallback{font-size:.95rem}
  .avatar.brandish .avatar-fallback{background:var(--primary);color:var(--primary-foreground)}
  .avatar-group{display:flex}                          /* flex -space-x-2 */
  .avatar-group .avatar{margin-left:-8px;box-shadow:0 0 0 2px var(--background)}
  .avatar-group .avatar:first-child{margin-left:0}
  .avatar-group.cinza .avatar{filter:grayscale(1)}
  /* ===== Stepper de quantidade ===== */
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--input);border-radius:var(--radius-md);overflow:hidden;flex:none;box-shadow:var(--shadow-xs)}
  .stepper button{border:none;background:var(--card);width:36px;height:36px;font-size:1rem;font-weight:500;cursor:pointer;color:var(--foreground);font-family:inherit}
  .stepper.sm button{width:32px;height:32px;font-size:1rem}
  .stepper.sm b{min-width:36px;font-size:.74rem}
  .stepper button:disabled{opacity:.4;cursor:not-allowed}
  .pbuy{display:flex;flex-direction:column;gap:6px;padding:0 9px 9px}
  .pbuy .linha{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .pbuy .un{font-size:.6rem;color:var(--muted-foreground);margin-top:-2px}
  .pbuy .subt{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbuy .btn{min-width:0}
  .pbuy .btn{min-width:0}
  .plist .pbuy{padding:0;flex-direction:row;align-items:center;gap:8px;margin-top:6px}
  .buybar{display:flex;align-items:center;gap:10px;margin:12px 0}
  .buybar .tot{flex:1}
  .buybar .tot b{display:block;font-size:1.05rem}
  .stepper button:hover{background:var(--accent)}
  .stepper b{min-width:42px;text-align:center;font-size:.8rem}
  /* ===== Filtros / chips ===== */
  .seg{display:flex;background:var(--muted);border-radius:var(--radius-lg);padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:transparent;padding:7px 2px;border-radius:var(--radius-sm);font-size:.76rem;font-weight:500;color:var(--muted-foreground);cursor:pointer;font-family:inherit;transition:.15s}
  .seg button.on{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:var(--shadow-sm)}
  .chiprow{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}
  .chiprow::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1px solid var(--input);background:var(--background);color:var(--foreground);border-radius:var(--radius-md);padding:6px 12px;font-size:.72rem;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:var(--shadow-xs);transition:.15s}
  .fchip:hover{background:var(--accent)}
  .fchip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  /* ===== Nav ===== */
  nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;font-weight:600;color:var(--ink-3);font-family:inherit;position:relative}
  nav button .ic{display:flex;align-items:center;justify-content:center;height:24px}
  nav button .svgi{width:21px;height:21px}
  nav button.on{color:var(--primary)}
  nav .nbadge{position:absolute;top:4px;right:50%;margin-right:-22px;background:var(--brand);color:#fff;font-size:.56rem;font-weight:700;border-radius:999px;padding:1px 5px}
  /* ===== Barra fixa de ação ===== */
  .actionbar{position:absolute;left:0;right:0;bottom:58px;background:var(--card);border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:35}
  .actionbar .tot{flex:1;min-width:0}
  .actionbar .tot b{font-size:1rem;display:block}
  /* ===== Sheets ===== */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end}
  .overlay.open{display:flex}
  .sheet{background:var(--popover);color:var(--popover-foreground);width:100%;border-radius:var(--radius-xl) var(--radius-xl) 0 0;border-top:1px solid var(--border);padding:18px 18px 26px;max-height:88%;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-size:1rem;margin-bottom:12px}
  .sheet .handle{width:42px;height:4px;border-radius:99px;background:var(--hairline);margin:0 auto 14px}
  label{display:block;font-size:.7rem;font-weight:700;color:var(--ink-2);margin:10px 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--input);border-radius:var(--radius-md);padding:9px 12px;font-size:.86rem;font-family:inherit;background:var(--field);color:var(--foreground);box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s}
  input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 45%,transparent)}
  .check{display:flex;align-items:center;gap:8px;font-size:.76rem;margin-top:10px;font-weight:500;color:var(--ink)}
  .check input{width:auto}
  .radiocard{border:1px solid var(--input);border-radius:var(--radius-lg);padding:12px;margin-bottom:8px;cursor:pointer;background:var(--card);box-shadow:var(--shadow-xs);transition:.15s}
  .radiocard.on{border-color:var(--ring);background:var(--card);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 35%,transparent)}
  .radiocard b{font-size:.84rem}
  .menuitem{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--hairline);cursor:pointer;font-size:.86rem;font-weight:600}
  .menuitem:last-child{border-bottom:none}
  .menuitem .mi{width:34px;height:34px;border-radius:10px;background:var(--chip-blue-bg);display:flex;align-items:center;justify-content:center;flex:none}
  .menuitem .mi .svgi{width:17px;height:17px;color:var(--chip-blue-tx)}
  .menuitem .md{font-size:.68rem;color:var(--ink-3);font-weight:400}
  .menuitem .arr{margin-left:auto;color:var(--ink-3)}
  /* shadcn Switch + Label */
  .ui-switch-row{display:flex;align-items:center;gap:8px}
  .ui-switch{position:relative;display:inline-flex;align-items:center;flex:none;width:32px;height:1.15rem;padding:0;
    border:1px solid transparent;border-radius:9999px;background:var(--input);cursor:pointer;
    box-shadow:var(--shadow-xs);transition:background-color .15s,box-shadow .15s}
  .ui-switch[data-state="checked"]{background:var(--primary)}
  .ui-switch:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
  .ui-switch-thumb{display:block;width:1rem;height:1rem;border-radius:9999px;background:var(--background);pointer-events:none;
    transform:translateX(0);transition:transform .15s}
  .ui-switch[data-state="checked"] .ui-switch-thumb{transform:translateX(calc(100% - 2px))}
  body[data-theme="dark"] .ui-switch[data-state="unchecked"] .ui-switch-thumb{background:var(--foreground)}
  body[data-theme="dark"] .ui-switch[data-state="checked"] .ui-switch-thumb{background:var(--primary-foreground)}
  .ui-label{font-size:.875rem;line-height:1;font-weight:500;color:var(--foreground);cursor:pointer;user-select:none}
  .switch{position:relative;width:44px;height:24px;flex:none;margin-left:auto}
  .switch input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;cursor:pointer;margin:0}
  .switch i{position:absolute;inset:0;background:var(--hairline);border-radius:99px;transition:.2s}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + i{background:var(--good)}
  .switch input:checked + i::after{left:23px}
  /* ===== Timeline de pedido ===== */
  .tl{display:flex;flex-direction:column;gap:0;margin-top:6px}
  .tlstep{display:flex;gap:10px;align-items:flex-start}
  .tlstep .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--hairline);background:var(--surface);flex:none;margin-top:2px}
  .tlstep.done .dot{background:var(--good);border-color:var(--good)}
  .tlstep .ln{width:2px;background:var(--hairline);margin-left:6px;height:16px}
  .tlstep.done .ln{background:var(--good)}
  .tlstep span{font-size:.76rem;color:var(--ink-2)}
  .tlstep.done span{color:var(--ink);font-weight:600}
  /* Rodapé (daisyUI footer-center, adaptado) — barra com o copyright, em todas as páginas, inclusive no login */
  main{--mx:14px;--mb:92px;--nav-h:64px}
  @media (min-width:1024px){ main{--mx:28px;--mb:48px;--nav-h:0px} }
  .site-footer,.login-footer{background:color-mix(in oklab,var(--muted) 90%,#000);color:var(--foreground);
    text-align:center;font-size:.875rem;line-height:1.5}
  .site-footer aside,.login-footer aside{display:grid;place-items:center}
  .site-footer p,.login-footer p{margin:0}
  .site-footer{margin:36px calc(var(--mx) * -1) calc(var(--mb) * -1);padding:16px var(--mx) calc(16px + var(--nav-h))}
  .login-footer{flex:none;padding:16px;border-top:1px solid rgba(0,0,0,.08)}
  /* shadcn Alert */
  .ui-alert{position:relative;display:grid;width:100%;grid-template-columns:0 1fr;align-items:start;row-gap:2px;
    border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--card-foreground);
    padding:12px 16px;font-size:.875rem;margin-bottom:12px}
  .ui-alert:has(>.svgi){grid-template-columns:16px 1fr;column-gap:12px}
  .ui-alert:has(>.ui-alert-action){grid-template-columns:0 1fr auto}
  .ui-alert:has(>.svgi):has(>.ui-alert-action){grid-template-columns:16px 1fr auto}
  .ui-alert>.svgi{width:16px;height:16px;transform:translateY(2px);color:currentColor}
  .ui-alert-title{grid-column-start:2;min-height:16px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
  .ui-alert-desc{grid-column-start:2;display:grid;justify-items:start;gap:4px;font-size:.875rem;color:var(--muted-foreground);line-height:1.5}
  .ui-alert-action{grid-column:3;grid-row:1 / span 2;align-self:center;margin-left:12px}
  .ui-alert[data-variant="destructive"]{color:var(--destructive)}
  .ui-alert[data-variant="destructive"] .ui-alert-desc{color:color-mix(in oklab,var(--destructive) 90%,transparent)}
  .alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px;font-size:.78rem;color:var(--warn-fg)}
  .alert b{display:block;font-size:.82rem;color:var(--warn-fg)}
  .alert>button{margin-left:auto;flex:none;align-self:center;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-weight:500;font-size:.72rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-xs)}
  .alert>button:hover{background:var(--accent)}
  .fld label{margin-top:10px}
  .grid2>.fld:first-child label,.grid2>.fld label{margin-top:10px}
  .bar{height:8px;background:var(--muted);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
  .bar.warn i{background:var(--warning)} .bar.crit i{background:var(--critical)}
  /* shadcn Table */
  .ui-table-wrap{position:relative;width:100%;overflow-x:auto}
  .ui-table{width:100%;caption-side:bottom;border-collapse:collapse;font-size:.875rem}
  .ui-table caption{margin-top:14px;color:var(--muted-foreground);font-size:.875rem}
  .ui-table thead tr{border-bottom:1px solid var(--border)}
  .ui-table tbody tr{border-bottom:1px solid var(--border);transition:background-color .15s}
  .ui-table tbody tr:last-child{border-bottom:0}
  .ui-table tbody tr:hover{background:color-mix(in oklab,var(--muted) 50%,transparent)}
  .ui-table th{height:40px;padding:0 8px;text-align:left;vertical-align:middle;font-weight:500;color:var(--foreground);white-space:nowrap}
  .ui-table td{padding:8px;vertical-align:middle;white-space:nowrap}
  .ui-table td:nth-child(3){white-space:normal;min-width:84px;line-height:1.3}
  .ui-table td:last-child,.ui-table th:last-child{padding-left:4px}
  .ui-table .w-100{width:100px}
  @media (max-width:520px){
    .ui-table{font-size:.78rem}
    .ui-table th,.ui-table td{padding-left:4px;padding-right:4px}
    .ui-table td:first-child{white-space:normal;line-height:1.25}
    .ui-table .w-100{width:auto}
    .ui-table td:nth-child(3){min-width:0}
  }
  .ui-table .t-right{text-align:right}
  .ui-table .t-medium{font-weight:500}
  .ui-table tfoot{border-top:1px solid var(--border);background:color-mix(in oklab,var(--muted) 50%,transparent);font-weight:500}
  .ui-table tfoot tr{border-bottom:0}
  .rcb{display:flex;align-items:center;gap:4px;font-size:.6rem;font-weight:500;color:var(--muted-foreground);margin:0 0 4px}
  .rcb .svgi{width:12px;height:12px;flex:none}
  .parc{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hairline)}
  .parc:last-child{border-bottom:none}
  .parc .dt{flex:0 0 46px;text-align:center;border-radius:var(--radius-md);background:var(--info-bg);color:var(--info-fg);padding:5px 2px;border:1px solid var(--border)}
  .parc .dt b{display:block;font-size:.88rem;line-height:1}
  .parc .dt span{font-size:.54rem;text-transform:uppercase;font-weight:700}
  .parc.venc .dt{background:var(--chip-cancel-bg);color:var(--chip-cancel-tx)}
  .parc.ok .dt{background:var(--chip-ok-bg);color:var(--chip-ok-tx)}
  .parc .pi{flex:1;min-width:0}
  .parc .pi b{font-size:.8rem;display:block}
  /* ===== Card (anatomia shadcn: Header/Title/Description/Action/Content/Footer) ===== */
  .ui-card{padding:24px 0;display:flex;flex-direction:column;gap:24px;margin:0;width:100%;max-width:24rem}
  .card-header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:6px;padding:0 24px}
  .card-title{grid-column:1;font-weight:600;font-size:1rem;line-height:1.1}
  .card-description{grid-column:1;color:var(--muted-foreground);font-size:.84rem;line-height:1.35}
  .card-action{grid-column:2;grid-row:1 / span 2;align-self:start;justify-self:end}
  .card-content{padding:0 24px}
  .card-footer{display:flex;flex-direction:column;gap:8px;padding:0 24px}
  .form-stack{display:flex;flex-direction:column;gap:24px}
  .form-group{display:grid;gap:8px}
  .form-group label{margin:0;font-size:.8rem;font-weight:500}
  .label-row{display:flex;align-items:center}
  .lnk-underline{margin-left:auto;font-size:.8rem;color:var(--foreground);cursor:pointer;text-underline-offset:4px}
  .lnk-underline:hover{text-decoration:underline}
  .login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
  /* ===== Checkbox + Field (anatomia shadcn) ===== */
  .cbx{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;margin:0;padding:0;border:1px solid var(--input);border-radius:4px;background:var(--card);box-shadow:var(--shadow-xs);cursor:pointer;position:relative;transition:.15s}
  .cbx:checked{background:var(--primary);border-color:var(--primary)}
  .cbx:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--primary-foreground);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .cbx:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 45%,transparent)}
  .cbx:disabled{opacity:.5;cursor:not-allowed}
  .field-group{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:row;align-items:center;gap:12px}
  .field:has(.field-content){align-items:flex-start}
  .field-content{display:flex;flex-direction:column;gap:3px}
  .field-label,.field-title{font-size:.82rem;font-weight:500;line-height:1.35;margin:0;color:var(--foreground);cursor:pointer;text-transform:none;letter-spacing:0}
  .field-description{color:var(--muted-foreground);font-size:.76rem;line-height:1.4;font-weight:400;letter-spacing:0;text-transform:none}
  .field[data-disabled]{opacity:.5}
  .field[data-disabled] .field-label{cursor:not-allowed}
  .field-card{display:block;margin:0;font-weight:400;color:var(--foreground);padding:14px;border:1px solid var(--input);border-radius:var(--radius-lg);background:var(--card);cursor:pointer;transition:.15s;box-shadow:var(--shadow-xs)}
  .field-card:hover{background:var(--accent)}
  .field-card:has(input:checked){border-color:var(--primary);background:color-mix(in oklab,var(--primary) 6%,var(--card))}
  .wsteps{display:flex;gap:4px;margin-bottom:8px}
  .wsteps i{flex:1;height:4px;border-radius:99px;background:var(--hairline)}
  .wsteps i.on{background:var(--primary)}
  .wlabel{font-size:.7rem;color:var(--ink-3);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
  .docbox{display:flex;align-items:center;gap:10px;border:1px dashed var(--input);border-radius:var(--radius-lg);padding:12px;margin-bottom:8px;cursor:pointer;position:relative;background:var(--card)}
  .docbox.ok{border-style:solid;border-color:var(--good);background:var(--chip-ok-bg)}
  .docbox input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .docbox .dn{flex:1;font-size:.78rem;font-weight:600}
  .docbox .ds{font-size:.66rem;color:var(--ink-3);font-weight:400}
  .docbox .svgi{color:var(--primary)}
  input.err,select.err{border-color:var(--critical)!important;background:var(--chip-cancel-bg)}
  .revrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:.76rem}
  .revrow:last-child{border-bottom:none}
  .revrow span:first-child{color:var(--ink-3);flex:none;max-width:46%}
  .revrow span:last-child{font-weight:600;text-align:right;word-break:break-word}
  .tipocard{border:1px solid var(--input);border-radius:var(--radius-lg);padding:13px;margin-bottom:9px;cursor:pointer;background:var(--card);display:flex;gap:11px;align-items:flex-start;box-shadow:var(--shadow-xs);transition:.15s}
  .tipocard.on{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 35%,transparent)}
  .tipocard .ti{width:36px;height:36px;border-radius:10px;background:var(--chip-blue-bg);color:var(--chip-blue-tx);display:flex;align-items:center;justify-content:center;flex:none}
  .fullscr{position:absolute;inset:0;background:var(--page);z-index:80;display:none;flex-direction:column;overflow-y:auto}
  .fullscr.open{display:flex}
  #toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#26251f;color:#fff;font-size:.76rem;font-weight:600;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:99;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-sm)}
  .kpi .v{font-size:1.05rem;font-weight:800}
  .kpi .l{font-size:.62rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .specrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:.76rem}
  .specrow:last-child{border-bottom:none}
  .specrow span:first-child{color:var(--ink-3)}
  .specrow span:last-child{font-weight:600;text-align:right}
  /* ===== Layout de desktop: sidebar no lugar da navegação inferior ===== */
  @media (min-width:1024px){
    body{padding:0;background:var(--background)}

    #phone:has(#sidebar[data-state="collapsed"]){--sb-w:var(--sidebar-width-icon)}

    header .top{justify-content:flex-start;gap:14px}
    header .searchbar{margin:0;flex:1;max-width:460px;order:2}

    .pgrid{grid-template-columns:repeat(4,1fr)}

    .actionbar{bottom:0;left:var(--sb-w);padding:12px 28px}
    .overlay{align-items:center;justify-content:center}
    .sheet{max-width:30rem;border-radius:var(--radius-xl);border:1px solid var(--border);margin:0 auto}
    .fullscr{z-index:80}

      background-image:linear-gradient(to bottom,rgba(32,24,17,0) 42%,rgba(32,24,17,.58)),var(--login-wide);
      background-size:cover,cover; background-position:center,center; background-repeat:no-repeat,no-repeat;
    }
    #loginscr .login-wrap{justify-content:flex-end;padding:32px 32px 3.5vh}
  }
  /* ---- Confecção de orçamento ---- */
  .oitem{border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px;margin-top:10px;background:var(--background)}
  .oi-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:2px}
  .oi-h .t{flex:1;min-width:0;font-size:.82rem;font-weight:700;line-height:1.25}
  .oi-h .thumb{width:44px;height:44px;flex:none}
  .oi-h .thumb .svgi{width:22px;height:22px}
  .oitem .x{flex:none;width:30px;height:34px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background);color:var(--ink-3);font-size:1.1rem;line-height:1;cursor:pointer}
  .oitem .x:hover{background:var(--accent);color:var(--foreground)}
  .orow{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;padding:3px 0}
  .orow.tot{border-top:1px solid var(--hairline);margin-top:4px;padding-top:7px;font-size:.95rem}
  .ficha{margin-top:10px;border:1px dashed var(--border);border-radius:var(--radius-md);padding:9px}
  .ficha summary{cursor:pointer;font-size:.8rem;font-weight:700;display:flex;gap:8px;align-items:center;list-style:none}
  .ficha summary::-webkit-details-marker{display:none}
  .ficha summary::before{content:'▸';font-size:.8rem;transition:transform .15s}
  .ficha[open] summary::before{transform:rotate(90deg)}
  .frow{display:grid;grid-template-columns:36% 1fr 30px;gap:6px;margin-top:6px}

const cfg = {dark:false, big:false, logged:false, perfil:null, empresa:'', cnpj:'', email:''};
let cur='home', catAtual=null, prodAtual=null, buscaQ='', ordem='rel';
let carrinho=[];     // {pid, qtd}
let qtdSel={};       // quantidade escolhida por produto (múltiplo de venda)
const getQtd = p => qtdSel[p.id] || p.mult;
function stepQtd(pid, dir, ev){
  if(ev) ev.stopPropagation();
  const p = prodOf(pid); if(!p) return;
  const v = Math.max(p.mult, Math.min(p.estoque, getQtd(p) + dir*p.mult));
  qtdSel[p.id] = v;
  document.querySelectorAll('[data-q="'+pid+'"]').forEach(e=>e.textContent=v);
  document.querySelectorAll('[data-t="'+pid+'"]').forEach(e=>e.textContent=BRL(preco(p)*v));
  document.querySelectorAll('[data-qminus="'+pid+'"]').forEach(e=>e.disabled = v<=p.mult);
  document.querySelectorAll('[data-qplus="'+pid+'"]').forEach(e=>e.disabled = v+p.mult>p.estoque);
}
function addRapido(pid, ev){
  if(ev) ev.stopPropagation();
  const p = prodOf(pid); if(!p) return;
  const q = getQtd(p);
  const it = carrinho.find(i=>i.pid===pid);
  it ? (it.qtd += q, it.receb = recebDe(p)) : carrinho.push({pid, qtd:q, receb:recebDe(p)});
  badges();
  if(cur==='carrinho') rCarrinho();
  toast(q+' '+p.un+' no carrinho ✓'+(faltaMin()>0?' · faltam '+BRL(faltaMin()):''));
}
/* seletor de quantidade reutilizado em card, lista e ficha */
function seletorQtd(p, sm){
  const q = getQtd(p);
  return `<span class="stepper ${sm?'sm':''}" onclick="event.stopPropagation()">
      <button aria-label="Diminuir quantidade" data-qminus="${p.id}" ${q<=p.mult?'disabled':''} onclick="stepQtd(${p.id},-1,event)">−</button>
      <b data-q="${p.id}">${q}</b>
      <button aria-label="Aumentar quantidade" data-qplus="${p.id}" ${q+p.mult>p.estoque?'disabled':''} onclick="stepQtd(${p.id},1,event)">+</button>
    </span>`;
}

function blocoCompra(p, compacto){
  if(p.orc) return `<div class="pbuy"><button class="btn brand sm block" onclick="event.stopPropagation();sheetOrcamento(${p.id})">Solicitar orçamento</button></div>`;
  if(!P())  return `<div class="pbuy"><button class="btn outline sm block" onclick="event.stopPropagation();mostrarPerfil()">Entrar para comprar</button></div>`;
  if(!p.estoque) return `<div class="pbuy"><button class="btn outline sm block" disabled>Indisponível</button></div>`;
  return `<div class="pbuy">
      <div class="linha">
        ${seletorQtd(p, compacto)}
        <b class="subt" data-t="${p.id}">${BRL(preco(p)*getQtd(p))}</b>
      </div>
      <div class="un">${p.un}${p.mult>1?' · caixa de '+p.mult:''}</div>
      <button class="btn default sm block" onclick="addRapido(${p.id},event)">${I('cart')} Adicionar</button>
    </div>`;
}

  const l=CATEGORIAS.filter(catVisivel);

let recebSel = {};   // pid → 'padrao' | 'd45'
const recebDe = p => recebSel[p.id] || (p.imp ? 'd45' : 'padrao');

/** Preço do perfil = tabela menos o desconto do tipo de cliente. */
function preco(p){ return P() ? p.tabela*(1-P().desc) : p.tabela; }
function descPct(){ return P() ? Math.round(P().desc*100) : 0; }
const subtotal = () => carrinho.reduce((s,i)=>s+preco(prodOf(i.pid))*i.qtd,0);
/* Política comercial: frete CIF por conta da ImportFácil em todos os pedidos. */
function frete(){ return 0; }
const totalGeral = () => subtotal()+frete();
const faltaMin = () => P() ? Math.max(0, P().min - subtotal()) : 0;
const qtdCarrinho = () => carrinho.reduce((s,i)=>s+i.qtd,0);
function badges(){
  if(document.getElementById('sbContent')) renderSidebar();
  const b=document.getElementById('cartBadge'), n=qtdCarrinho();

  const f=document.getElementById('favDot');
  if(f){ f.style.display = favoritos.length?'block':'none'; f.textContent=favoritos.length; }
}
function falhaFoto(pid, el){
  const p = prodOf(pid); if(!p) return;
  p.fotos = (p.fotos||[]).filter(f=>f.src!==p.img);
  p.img = (p.fotos.find(f=>!f.up)||{}).src || null;
  const h = el.parentElement ? el.parentElement.offsetHeight||92 : 92;
  el.outerHTML = p.img ? '<img src="'+p.img+'" alt="" onerror="falhaFoto('+pid+',this)">'
                       : (p.ilu ? ILUS(p.ilu,h) : I(catOf(p.cat).ic));
}
function arte(p,h){
  if(p.img) return '<img src="'+p.img+'" alt="'+p.nome+'" loading="lazy" onerror="falhaFoto('+p.id+',this)">';
  if(p.ilu) return ILUS(p.ilu,h);                              // ilustração vetorial do item
  return I(catOf(p.cat).ic);                                   // fallback: ícone da categoria
}
function thumb(p, h){
  const badge = p.orc ? '<span class="badge-desc" style="background:var(--brand);color:var(--brand-foreground)">ORÇAMENTO</span>'
              : (P() ? '<span class="badge-desc">-'+descPct()+'%</span>' : '');
  return '<div class="thumb" style="height:'+h+'px">'+badge+arte(p,h)+'</div>';
}
const back = (to,t) => '<div class="backrow"><button aria-label="Voltar" onclick="go(\''+to+'\')">←</button><b>'+t+'</b></div>';

const BUSCAS_PERFIL={cooperativa:['Ureia','Trator','EPI','Filtro','Módulo solar','Câmera','Motosserra','Pivô'],
  distribuidora:['Ferramenta','EPI','Filtro','Câmera','Módulo solar','Lanterna','Cadeado','Fita'],
  revendedor:['Ferramenta','EPI','Câmera','Lanterna','Cadeado','Bateria','Fita','Furadeira'],
  construtora:['Furadeira','EPI','Capacete','Cimento','Trena','Nível','Disco de corte','Câmera'],
  hospital:['Seringa','Luva','Máscara N95','Gaze','Lençol TNT','Maca','Cadeira de rodas','Agulha']};
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const SINONIMOS={luva:['luvas','procedimento'],mascara:['n95','pff2','cirurgica'],seringa:['seringas'],capacete:['protecao','epi'],furadeira:['parafusadeira','perfuratriz'],tubo:['cano'],cano:['tubo'],lampada:['led'],camera:['cftv','videomonitoramento'],gerador:['geracao'],cadeira:['cadeira de rodas']};
let recentes=[];
function lembrarProduto(id){ recentes=[id,...recentes.filter(x=>x!==id)].slice(0,8); }
function buscaMatch(p,q){
  const alvo=semAcento(p.nome+' '+p.marca+' '+p.cod+' '+catOf(p.cat).nome+' '+(p.sub||'')+' '+(p.desc||''));
  const termos=semAcento(q).split(/\s+/).filter(Boolean);
  return termos.every(t=> alvo.includes(t) || (SINONIMOS[t]||[]).some(s=>alvo.includes(s)));
}
function rBusca(){
  const q=buscaQ.trim().toLowerCase();
  const imp = q==='__imp__';
  pagResetar('busca|'+q);
  const list = imp ? impPerfil()
             : (q? prodsPerfil().filter(p=>buscaMatch(p,q)) : []);
  document.getElementById('scr-busca').innerHTML=
    back('home','Buscar')+`
    <input id="qInput" placeholder="Produto, marca ou código…" value="${imp?'':oesc(buscaQ)}" oninput="buscaQ=this.value;rBusca();document.getElementById('qInput').focus()">
    ${q? `<div class="muted" style="margin:12px 0 6px">${imp?list.length+' itens da linha de importação':list.length+' resultado(s) para &quot;'+oesc(buscaQ)+'&quot;'}</div>
          <div class="card">${list.slice(0,pagN).map(plinha).join('')||'<div class="empty">Nada encontrado</div>'}</div>${pagRodape(list.length,'busca')}`
       : `<div class="section-title">Buscas frequentes</div>
          <div class="chiprow" style="flex-wrap:wrap">
            ${(BUSCAS_PERFIL[cfg.perfil]||BUSCAS_PERFIL.cooperativa).map(t=>`<button class="fchip" onclick="buscaQ='${t}';rBusca()">${t}</button>`).join('')}
          </div>
          ${recentes.length?`<div class="section-title">Vistos recentemente</div><div class="card">${recentes.map(prodOf).filter(p=>p&&prodsPerfil().includes(p)).slice(0,5).map(plinha).join('')}</div>`:''}

}

function stepQ(id,dir){

  document.getElementById('qsub').textContent=BRL(preco(p)*window._q);
}
function setReceb(pid,k){

function trocaReceb(pid){

function addCarrinho(id){

/* ---------- Pedido rápido por lista de códigos / CSV ---------- */
function sheetPedidoRapido(){
  if(!P()){ toast('Entre e escolha o tipo de empresa primeiro'); mostrarPerfil(); return; }
  openSheet(`<h2>Pedido rápido por códigos</h2>
    <div class="muted" style="margin-bottom:8px">Cole uma linha por item no formato <b>CÓDIGO;QUANTIDADE</b> (ou carregue um arquivo .csv). A quantidade é ajustada ao múltiplo de venda.</div>
    <label for="prTxt">Lista de códigos</label>
    <textarea id="prTxt" rows="6" placeholder="DF-FI13;12&#10;HC-LV01;200&#10;CN-QD12;2"></textarea>
    <label for="prArq">Ou carregue um arquivo CSV</label>
    <input id="prArq" type="file" accept=".csv,.txt,text/csv,text/plain" onchange="prLerArquivo(this)">
    <div id="prRes" class="muted" style="margin-top:8px"></div>
    <button class="btn brand block" style="margin-top:12px" onclick="pedidoRapido()">Adicionar ao carrinho</button>`);
}
function prLerArquivo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>200000){ toast('Arquivo muito grande (máx. 200 KB)'); return; }
  const r=new FileReader(); r.onload=()=>{ document.getElementById('prTxt').value=String(r.result||'').slice(0,50000); }; r.readAsText(f);
}
function pedidoRapido(){
  const txt=(document.getElementById('prTxt').value||'');
  const linhas=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!linhas.length){ toast('Informe ao menos uma linha'); return; }
  const mapa={}; prodsPerfil().forEach(p=>{ mapa[normCod(p.cod)]=p; });
  let ok=0; const falhas=[];
  linhas.forEach((l,i)=>{
    const m=l.split(/[;,\t]|\s{2,}|\s(?=\d+$)/).map(x=>x.trim()).filter(Boolean);
    if(i===0 && /c[óo]d/i.test(m[0]||'')) return;           // cabeçalho
    const p=mapa[normCod(m[0])]; let q=parseInt((m[1]||'').replace(/\D/g,''),10);
    if(!p){ falhas.push(oesc(m[0]||l)+': código não encontrado'); return; }
    if(p.orc){ falhas.push(oesc(p.cod)+': produto sob orçamento'); return; }
    if(!(q>0)) q=p.mult;
    q=Math.min(p.estoque,Math.max(p.mult,Math.ceil(q/p.mult)*p.mult));
    const it=carrinho.find(x=>x.pid===p.id);
    it ? (it.qtd+=q) : carrinho.push({pid:p.id,qtd:q,receb:recebDe(p)});
    ok++;
  });
  badges(); if(cur==='carrinho') rCarrinho();
  if(falhas.length){ document.getElementById('prRes').innerHTML='<b class="pos">'+ok+' item(ns) adicionados.</b><br>Não adicionados:<br>'+falhas.slice(0,12).join('<br>'); if(ok) toast(ok+' item(ns) no carrinho ✓'); }
  else { closeSheet(); toast(ok+' item(ns) adicionados ao carrinho ✓'); go('carrinho'); }
}

            <div class="row" style="margin-top:6px">
              <span class="stepper">
                <button onclick="mudaQtd(${i.pid},-1)">−</button><b>${i.qtd}</b><button onclick="mudaQtd(${i.pid},1)">+</button>

  montaActionbar(falta);

function mudaQtd(pid,dir){
  const p=prodOf(pid), it=carrinho.find(i=>i.pid===pid); if(!it) return;
  it.qtd=Math.min(p.estoque, it.qtd+dir*p.mult);
  if(it.qtd<p.mult) carrinho=carrinho.filter(i=>i.pid!==pid);

/* ================= CHECKOUT ================= */
let ck = {meio:'pix', boleto:3, cartao:1};   // meio: pix | boleto | cartao
/* divide o total em n parcelas; a última absorve o arredondamento */
function valParc(total, n, i){
  const bruto = Math.round(total/n*100)/100;
  return i===n-1 ? Math.round((total-bruto*(n-1))*100)/100 : bruto;
}
/* cartão: sem juros até o limite da política; acima disso, tabela Price com a taxa mensal */
function cartaoCalc(total, n){
  if(n<=politica.cartaoSemJurosAte || !(+politica.cartaoJurosAm)) return {n, parc:total/n, total, juros:false};
  const i = politica.cartaoJurosAm/100, parc = total*i/(1-Math.pow(1+i,-n));
  return {n, parc, total:parc*n, juros:true};
}
function rCheckout(){

  const blq = bloqueioBoleto(base);

  const cc = cartaoCalc(base, ck.cartao);
  const tot = ck.meio==='pix' ? base-descPix : ck.meio==='cartao' ? cc.total : base;
  const dias = prazosDe('Boleto '+opts[ck.boleto]), nb = dias.length;

      <div class="row"><b>${titulo}</b>${ck.meio===k?I('check'):''}</div><div class="muted">${sub}</div></div>`;
  let det = '';

      <div class="muted">Ao confirmar, você recebe o QR Code e o código copia e cola, válidos por ${politica.pixHoras} horas. O pedido é liberado assim que o banco confirma o pagamento. Se o Pix vencer, o pedido fica aguardando e você gera um novo código.</div></div>`;
  if(ck.meio==='boleto') det = blq
    ? `<div class="alert">🔒<div><b>${blq.t}</b>${blq.d}</div><button class="btn default sm" onclick="${blq.acao[1]}">${blq.acao[0]}</button></div>`

      ${dias.map((d,i)=>`<div class="specrow"><span>Parcela ${i+1} · ${d} dias após o faturamento</span><span>${BRL(valParc(base,nb,i))}</span></div>`).join('')}
      <div class="muted" style="margin-top:8px">Os boletos são emitidos no faturamento, junto com a nota fiscal. Usa ${BRL(base)} do seu limite de crédito (disponível ${BRL(Math.max(0,limiteCredito()-usoLimite()))}). Em caso de atraso: multa de ${politica.multa}% e juros de ${politica.jurosAm}% ao mês.</div></div>`;
  if(ck.meio==='cartao') det = `<div class="card"><h2 class="h3x">Parcelas no cartão</h2>

        return `<option value="${n}" ${n===ck.cartao?'selected':''}>${n}× de ${BRL(c.parc)}${c.juros?' · total '+BRL(c.total):' sem juros'}</option>`;}).join('')}</select>
      <div class="muted" style="margin-top:8px">As parcelas são cobradas pela operadora, na fatura do seu cartão. O pedido fica pago na hora e não usa o seu limite de crédito na ImportFácil.</div>
      <div class="note">No app real, os dados do cartão são digitados no formulário seguro do gateway de pagamento e nunca ficam guardados na ImportFácil.</div></div>`;
  const rotulo = ck.meio==='pix' ? 'Confirmar e gerar o Pix' : ck.meio==='boleto' ? 'Confirmar pedido no boleto' : 'Pagar com cartão (simulado)';

function finalizar(){
  const base = totalGeral(), opts = prazosBoleto();
  if(ck.meio==='boleto' && bloqueioBoleto(base)){ toast('O boleto não está disponível para este pedido'); rCheckout(); return; }

  let pgto, tot = base, cartao = null;
  if(ck.meio==='pix'){ pgto='Pix à vista'; tot=Math.round(base*(100-politica.pixDesc))/100; }
  else if(ck.meio==='boleto'){ pgto='Boleto '+opts[ck.boleto]; }
  else { const c=cartaoCalc(base,ck.cartao); tot=Math.round(c.total*100)/100;
         pgto='Cartão de crédito '+c.n+'×'; cartao={n:c.n, parc:c.parc, total:tot, juros:c.juros, pagoEm:fmtD(D0)}; }
  pedidos.unshift({num, por:(cad.respNome||cfg.email||'Comprador'), aprov:(cad.compNome||''),
    itens:carrinho.map(i=>({...i})), total:tot, frete:frete(), pgto, cartao,
    status: ck.meio==='cartao' ? 2 : 1, data:dataHoje(), ref:document.getElementById('ckRef').value});
  if(ck.meio==='pix') gerarParcelas(num, pgto, tot, D0);
  if(ck.meio==='boleto') pedidos[0].aguardaFat = true;      // boletos nascem no faturamento, com a NF-e
  if(ck.meio==='cartao') faturar(pedidos[0], true);          // cartão: pago na hora, nota emitida já
  carrinho=[]; badges(); go('pedidos');
  if(ck.meio==='pix'){ const p=parcelas.find(x=>x.pedido===num); toast('Pedido '+num+' criado · pague o Pix para liberar'); if(p) sheetPagar(p.id); }
  else if(ck.meio==='boleto') toast('Pedido '+num+' enviado ✓ · os boletos saem no faturamento, com a nota fiscal');
  else toast('Pagamento aprovado no cartão (simulado) ✓ · pedido '+num+' liberado');
}

const STATUS=['','Em análise','Aprovado','Faturado','Em transporte','Entregue'];
/* parcelas de Pix vencem em 24 h; um Pix vencido deixa o pedido aguardando um novo código */
const ehPix = p => /pix/i.test(p.forma||'');
const pixExpirado = p => !p.pago && ehPix(p) && p.expira && Date.now() > p.expira;
function pixPendente(num){ return parcelas.find(p=>p.pedido===num && !p.pago && ehPix(p)); }
function statusTxt(o){
  const px = pixPendente(o.num);
  if(px) return pixExpirado(px) ? 'Aguardando pagamento (Pix expirado)' : 'Aguardando pagamento';
  if(o.aguardaFat && o.status<3) return STATUS[o.status]+' · boletos no faturamento';
  return STATUS[o.status];
}
/* Faturamento: emite a NF-e (simulada) e, no boleto, cria as parcelas a partir desta data */
let nfeSeq = 1000;
function faturar(o, silencioso){
  if(!o.nfe){ nfeSeq = Math.max(nfeSeq, ...pedidos.concat(ordens).map(x=>x.nfe?x.nfe.n:0)) + 1;
    o.nfe = {n:nfeSeq, data:dataHoje()}; }
  if(o.aguardaFat){ gerarParcelas(o.num, o.pgto, o.total, D0); delete o.aguardaFat; }
  if(!silencioso) toast(o.num+': faturado · NF-e '+o.nfe.n+(nParcelas(o.num)?' · boletos emitidos':''));
}
function avancaStatus(o){
  if(!o || o.status>=5) return;
  if(pixPendente(o.num)){ toast('Aguardando o pagamento do Pix'); return; }
  o.status++;
  if(o.status===3) faturar(o);
  else toast(o.num+': '+STATUS[o.status]);
}

const PDF_REG=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_BLD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
function pdfW(s,size,bold){
  const t=bold?PDF_BLD:PDF_REG; let w=0;
  for(const ch of String(s)){ const b=ch.normalize('NFD')[0].charCodeAt(0); w+=(b>=32&&b<=126?t[b-32]:556); }
  return w*size/1000;
}
function pdfEnc(s){
  const M={0x2014:0x97,0x2013:0x96,0x2022:0x95,0x201C:0x93,0x201D:0x94,0x2018:0x91,0x2019:0x92,0x20AC:0x80,0x2082:0x32};
  let r='';
  for(const ch of String(s)){ let c=ch.charCodeAt(0); if(M[c]) c=M[c]; else if(c>255) c=63; if(c<32) c=32; r+=String.fromCharCode(c); }
  return r.replace(/[\\()]/g,m=>'\\'+m);
}
function pdfWrap(s,wid,size,bold){
  const out=[];
  String(s==null?'':s).split('\n').forEach(par=>{
    let cur='';
    par.split(' ').forEach(word=>{
      while(pdfW(word,size,bold)>wid){            // palavra maior que a coluna: quebra por caractere
        let k=1; while(k<word.length && pdfW(word.slice(0,k+1),size,bold)<=wid) k++;
        if(cur){out.push(cur);cur='';}
        out.push(word.slice(0,k)); word=word.slice(k);
      }
      const t=cur?cur+' '+word:word;
      if(pdfW(t,size,bold)<=wid) cur=t; else { out.push(cur); cur=word; }
    });
    out.push(cur);
  });
  return out;
}
function pdfOrcamento(o){
  const W=595.28,H=841.89,M=40,CW=W-2*M,BOT=H-56;
  const INK=[.11,.11,.10], GR=[.42,.40,.38], LN=[.88,.86,.84];

  const txtR=(xr,top,s,size,bold,c)=>txt(xr-pdfW(s,size,bold),top,s,size,bold,c);
  const rect=(x,top,w,h,c)=>ops.push(`${col(c)} rg ${x.toFixed(2)} ${(H-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  const line=(x1,top,x2,c,wd)=>ops.push(`${wd||.5} w ${col(c||LN)} RG ${x1.toFixed(2)} ${(H-top).toFixed(2)} m ${x2.toFixed(2)} ${(H-top).toFixed(2)} l S`);
  const ensure=h=>{ if(y+h>BOT) newPage(); };
  const titulo=t=>{ ensure(34); y+=10; txt(M,y,t.toUpperCase(),8.5,true,GR); y+=15; };
  const kv=(rows,kw)=>{
    kw=kw||125;
    rows.filter(r=>r[1]!==''&&r[1]!=null).forEach(([k,v])=>{
      const l=pdfWrap(v,CW-kw-8,9.5,false), h=l.length*12+5;
      ensure(h); txt(M+4,y+2,k,9.5,false,GR);
      l.forEach((s,i)=>txt(M+kw,y+2+i*12,s,9.5,false));
      y+=h; line(M,y,M+CW);
    });
  };
  newPage();
  // cabeçalho
  txt(M,y,'ImportFácil',20,true); txt(M,y+25,o.ehOC?'Ordem de compra · Setor de Importação':'Proposta comercial',9,false,GR);
  txtR(M+CW,y,o.num,14,true);
  const val=fmtD(addD(new Date(o.ts),o.validade||0));
  txtR(M+CW,y+19,'Emissão: '+o.data,9,false,GR); txtR(M+CW,y+31,o.ehOC?'Orçamento: '+o.orcNum:'Válido até: '+val,9,false,GR);
  y+=48; line(M,y,M+CW,INK,1.5); y+=4;

  titulo('Cliente');
  kv([['Razão social',o.cli.razao],['CNPJ',o.cli.cnpj],['Contato',o.cli.contato],['E-mail',o.cli.email],['Telefone',o.cli.fone],['Entrega',o.cli.entrega],['Tipo de cliente',o.tipo],['Destino da ordem',o.ehOC?'Setor de Importação — ImportFácil':'']]);

  titulo('Itens');
  const X={n:M+4,d:M+24,u:M+252,q:M+322,p:M+412,t:M+CW-4}, DW=X.u-X.d-8;
  const head=()=>{ rect(M,y,CW,18,[.95,.94,.93]);
    txt(X.n,y+5,'#',8.5,true); txt(X.d,y+5,'Descrição',8.5,true); txt(X.u,y+5,'Un',8.5,true);
    txtR(X.q,y+5,'Qtd',8.5,true); txtR(X.p,y+5,'Unitário',8.5,true); txtR(X.t,y+5,'Total',8.5,true); y+=20; };
  ensure(60); head();
  o.itens.forEach((it,i)=>{
    const l=pdfWrap(oNome(it),DW,9,false), h=l.length*11.5+8;
    if(y+h>BOT){ newPage(); head(); }
    txt(X.n,y+3,String(i+1),9,false);
    l.forEach((s,k)=>txt(X.d,y+3+k*11.5,s,9,false));
    txt(X.u,y+3,oUn(it),9,false); txtR(X.q,y+3,String(it.qtd),9,false);
    txtR(X.p,y+3,BRL(oPreco(it)),9,false); txtR(X.t,y+3,BRL(oSub(it)),9,false);
    y+=h; line(M,y,M+CW);
  });
  ensure(30); line(M,y+2,M+CW,INK,1.2); y+=8;
  txtR(X.p,y,'Total',11,true); txtR(X.t,y,BRL(oTotal(o)),11,true); y+=22;

  titulo('Fichas técnicas');
  o.itens.forEach((it,i)=>{
    const f=it.ficha.filter(r=>r[0]||r[1]);
    ensure(60);
    const tl=pdfWrap((i+1)+'. '+oNome(it),CW-12,9.5,true), th=tl.length*12+6;
    rect(M,y,CW,th,[.96,.95,.94]); tl.forEach((s,k)=>txt(M+6,y+4+k*12,s,9.5,true)); y+=th+2;
    if(f.length) kv(f.map(r=>[r[0],r[1]]),150); else { txt(M+6,y+2,'Ficha não preenchida',9,false,GR); y+=16; }
    if(it.tec){ pdfWrap('Descrição técnica: '+it.tec,CW-12,9,false).forEach(s=>{ ensure(12); txt(M+6,y+2,s,9,false); y+=12; }); y+=2; }
    if(it.anexo){ ensure(14); txt(M+6,y+2,'Anexo: '+it.anexo,9,false,GR); y+=14; }
    y+=6;
  });

  if(o.ehOC){ titulo('Aprovação do cliente (aceite)'); kv([['Responsável',o.aprov.nome],['Cargo',o.aprov.cargo],['Aceite em',o.aprov.quando],['Declaração',o.aprov.decl]]); }
  titulo('Condições comerciais');
  kv(o.ehOC ? [['Pagamento',o.cond.pgto],['Frete',o.cond.frete],['Prazo para recebimento',o.cond.prazo],['Previsão de recebimento',o.recebPrev],['Nº do pedido do cliente',o.poCli],['Incoterm',o.imp&&o.imp.incoterm],['Moeda de faturamento',o.imp&&o.imp.moeda],['Requisitos regulatórios',o.imp&&o.imp.regul],['Garantia',o.cond.garantia]]
            : [['Pagamento',o.cond.pgto],['Frete',o.cond.frete],['Prazo para recebimento',o.cond.prazo],['Garantia',o.cond.garantia],['Validade da proposta',o.validade+' dias (até '+val+')']]);
  if(o.obs){ titulo('Observações'); pdfWrap(o.obs,CW-8,9.5,false).forEach(s=>{ ensure(13); txt(M+4,y+1,s,9.5,false); y+=13; }); }

  ensure(90); y+=10;
  pdfWrap(o.ehOC?'Ordem de compra gerada a partir do aceite do cliente na proposta '+o.orcNum+'. Os itens seguem o prazo de recebimento informado e as fichas técnicas acima.':'Valores sujeitos a confirmação de estoque e a alterações tributárias. Produtos de importação seguem o prazo de recebimento informado na proposta.',CW,8,false).forEach(s=>{ txt(M,y,s,8,false,GR); y+=10.5; });
  y+=34; line(M,y,M+215,INK,.8); line(M+CW-215,y,M+CW,INK,.8);
  const sg1=o.ehOC?'Setor de Importação — recebido em':'Responsável comercial', sg2=o.ehOC?'Aprovação do cliente (aceite eletrônico)':'De acordo — Cliente';
  txt(M+215/2-pdfW(sg1,8.5,false)/2,y+4,sg1,8.5,false,GR);
  txt(M+CW-215/2-pdfW(sg2,8.5,false)/2,y+4,sg2,8.5,false,GR);

  // rodapé com numeração
  pages.forEach((p,i)=>{ ops=p; line(M,H-40,M+CW,LN,.5);
    txt(M,H-34,'ImportFácil · '+o.num,8,false,GR); txtR(M+CW,H-34,'Página '+(i+1)+' de '+pages.length,8,false,GR); });

  // montagem do arquivo
  const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  const kids=[];
  pages.forEach((p,i)=>{
    const pi=5+i*2, ci=6+i*2, data=p.join('\n'); kids.push(pi+' 0 R');
    objs[pi]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`;
    objs[ci]=`<< /Length ${data.length} >>\nstream\n${data}\nendstream`;
  });
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
  objs.push(`<< /Title (${pdfEnc(docNome(o))}) /Producer (ImportFácil) >>`);
  const info=objs.length-1;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const off=[];
  for(let i=1;i<objs.length;i++){ off[i]=out.length; out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
  const xr=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n'+off.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}

const ehMovel = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
async function orcBaixarBlob(blob,nome){
  // No visualizador do Artifact o download passa pela capacidade "downloads"; fora dele (arquivo local) usa o link direto.
  let dl=null;
  try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename:nome,data:blob}); return 'ok'; }
    catch(e){ return (e&&e.code==='declined')?'declined':'erro'; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  return 'ok';
}
async function orcBaixar(num){
  const o=num?orcamentos.find(x=>x.num===num):orcVer; if(!o) return;
  const r=await orcBaixarBlob(pdfOrcamento(o),orcPdfNome(o));

    status:OC_ETAPAS[0], hist:[{st:OC_ETAPAS[0],quando:agoraTxt()}], modal};
  ordens.unshift(oc);
  if(modal==='contaordem') addNumerario(oc,'cambio',coValores(oTotal(oc)).merc,'Numerário da mercadoria (câmbio)'); o.status='Aprovado'; o.ocNum=oc.num;
